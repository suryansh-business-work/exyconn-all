<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content Security Policy. The renderer talks to the portal only through the main process
      (IPC), so it connects nowhere itself; ws://localhost:4005 is Vite's dev HMR socket.
      style-src needs 'unsafe-inline' for MUI/emotion's runtime styles. The script hash is the
      React Fast Refresh preamble @vitejs/plugin-react 4.x injects in dev only. Screenshots
      are served from ImageKit.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-Z2/iFzh9VMlVkEOar1f/oSHWwQk3ve1qk/C2WdsC4Xk='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://ik.imagekit.io; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self' ws://localhost:4005; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <title>Exyconn Tracker</title>
    <style>
      /*
       * Only what MUI's CssBaseline cannot do: kill the white flash before React mounts.
       * `%SPLASH_BG%` is substituted at build time with the same token the dark theme
       * paints (`color.neutral[900]`) — see the splashBackground plugin in
       * electron.vite.config.ts. HTML cannot import a token, so the config injects it.
       */
      html,
      body,
      #root {
        height: 100%;
      }
      body {
        margin: 0;
        background-color: %SPLASH_BG%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
