<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exyconn Tracker</title>
    <style>
      /*
       * Only what MUI's CssBaseline cannot do: kill the white flash before React mounts.
       * `%SPLASH_BG%` is substituted at build time with the same token the dark theme
       * paints (`color.neutral[900]`) — see the splashBackground plugin in
       * electron.vite.config.ts. HTML cannot import a token, so the config injects it.
       */
      html,
      body,
      #root {
        height: 100%;
      }
      body {
        margin: 0;
        background-color: %SPLASH_BG%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
