appId: com.exyconn.timetracker
productName: Exyconn Tracker
copyright: Copyright © Exyconn

# The update feed the installed app polls. `generic` and not `github` on purpose: the
# portal serves the release files (see the server's /tracker-updates route), so the app
# needs no GitHub credentials and keeps working if the repository is ever made private.
# Configuring publish is also what makes electron-builder emit the latest*.yml manifests
# the updater reads — the release workflow uploads them beside the installers.
publish:
  provider: generic
  url: https://portal-server.exyconn.com/tracker-updates

directories:
  output: dist
  buildResources: build

asar: true
# Every native module here ships N-API prebuilt binaries, so there is nothing to rebuild.
npmRebuild: false

files:
  - out/**/*
  # electron-vite's `?asset` import compiles to path.join(__dirname, '../../resources/…'),
  # which lands inside the asar — so the tray icon must be packed there or it silently
  # resolves to nothing and the tray goes blank. Electron reads from the asar natively.
  - resources/**/*
  - package.json

# Keep native binaries OUTSIDE the asar so uiohook-napi's .node and get-windows'
# macOS Swift helper + node-pre-gyp addon resolve at runtime.
asarUnpack:
  - '**/node_modules/uiohook-napi/**'
  - '**/node_modules/get-windows/**'
  - '**/node_modules/@mapbox/node-pre-gyp/**'

# Every artifactName spells the name with a dash, never `${productName}`. The product name
# has a space, and GitHub stores an uploaded "Exyconn Tracker-…" as "Exyconn.Tracker-…" —
# while latest*.yml still asks for the name with the space, which the update feed cannot
# find, so every in-app update failed to download. artifact-names.test.ts guards this.
# Every frame of icon.ico must stay under 64 KB: rcedit writes only the low 16 bits of a
# frame's size into the .exe's icon directory, so a bigger 256px frame is read back truncated.
win:
  target:
    - nsis
  icon: build/icon.ico
  artifactName: Exyconn-Tracker-Setup-${version}.${ext}

# The installer is the first thing anybody sees of the app: the logo on its window, its
# uninstaller and the shortcuts it makes, and the brand sidebar on its welcome and finish
# pages. The bitmaps are 24-bit BMPs at NSIS's own sizes (sidebar 164×314, header 150×57) —
# the only format its Modern UI draws reliably. Regenerate them from build/logo-source.png.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Exyconn Tracker
  runAfterFinish: true

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  artifactName: Exyconn-Tracker-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extendInfo:
    NSScreenCaptureUsageDescription: Exyconn Tracker captures periodic work screenshots while you are tracking.
    NSAppleEventsUsageDescription: Exyconn Tracker reads the active window title to record app usage.
    # Only ever used when the workspace has switched webcam capture on, and only while
    # tracking is running. macOS shows this sentence in its own permission prompt.
    NSCameraUsageDescription: Exyconn Tracker takes a photo with each work screenshot, if your workspace has enabled it.

# The disk image opens on the app beside an Applications link, over a background that says
# what to do; background@2x.png beside it is picked up for Retina screens.
dmg:
  sign: false
  title: Exyconn Tracker ${version}
  icon: build/icon.icns
  background: build/background.png
  iconSize: 100
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications

linux:
  target:
    - AppImage
  category: Office
  icon: build/icon.png
  # Electron names a Linux window's WM_CLASS after package.json `name`; the desktop entry
  # defaults to the product name, so the dock could not tie the window to the entry's icon.
  desktop:
    StartupWMClass: exyconn-tracker-app
  artifactName: Exyconn-Tracker-${version}.${ext}
