fragment StatusDayFields on StatusDayPoint {
  date
  uptimePercent
  avgResponseMs
  checks
  failures
}

query StatusOverview($days: Int) {
  statusOverview(days: $days) {
    state
    generatedAt
    checkIntervalMinutes
    total
    operational
    degraded
    down
    uptimeToday
    uptime30d
    avgResponseMs
    services {
      id
      key
      name
      description
      category
      url
      state
      responseMs
      lastCheckedAt
      lastError
      uptimeToday
      uptime30d
      days {
        ...StatusDayFields
      }
    }
    daily {
      ...StatusDayFields
    }
    incidents {
      id
      serviceKey
      serviceName
      title
      source
      impact
      affectedServiceKeys
      state
      reason
      updates {
        ...StatusIncidentUpdateFields
      }
      startedAt
      resolvedAt
      durationMinutes
    }
    maintenance {
      id
      title
      body
      affectedServiceKeys
      startsAt
      endsAt
      inProgress
    }
  }
}

fragment StatusIncidentUpdateFields on StatusIncidentUpdate {
  id
  status
  body
  authorName
  createdAt
}

query ProblemReportStatus($reference: String!) {
  problemReportStatus(reference: $reference) {
    reference
    status
    serviceName
    updatedAt
  }
}

mutation SubmitProblemReport($input: SubmitProblemReportInput!) {
  submitProblemReport(input: $input) {
    reference
    submittedAt
  }
}

mutation SubscribeToStatus($email: String!) {
  subscribeToStatus(email: $email)
}

mutation ConfirmStatusSubscription($token: String!) {
  confirmStatusSubscription(token: $token)
}

mutation UnsubscribeFromStatus($token: String!) {
  unsubscribeFromStatus(token: $token)
}

fragment ProblemReportFields on ProblemReport {
  id
  reference
  serviceKey
  serviceName
  category
  severity
  status
  subject
  description
  reporterName
  reporterEmail
  pageUrl
  assignee
  resolutionNotes
  createdAt
}

query ListProblemReportsPaged($input: TableQueryInput!) {
  listProblemReportsPaged(input: $input) {
    rows {
      ...ProblemReportFields
    }
    totalCount
  }
}

query ListProblemReportsStats {
  listProblemReportsStats {
    total
    counts {
      field
      buckets {
        value
        count
      }
    }
    sums {
      field
      total
    }
  }
}

mutation CreateProblemReport($input: ProblemReportInput!) {
  createProblemReport(input: $input) {
    id
  }
}

mutation UpdateProblemReport($id: ID!, $input: ProblemReportInput!) {
  updateProblemReport(id: $id, input: $input) {
    id
  }
}

mutation DeleteProblemReport($id: ID!) {
  deleteProblemReport(id: $id)
}

