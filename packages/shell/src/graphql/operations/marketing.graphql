query ListCampaigns {
  listCampaigns {
    id
    name
    channel
    budget
    startDate
    endDate
    status
    subject
    body
    lastSentAt
    recipientsCount
  }
}

query ListCampaignsPaged($input: TableQueryInput!) {
  listCampaignsPaged(input: $input) {
    totalCount
    rows {
      id
      name
      channel
      budget
      startDate
      endDate
      status
      subject
      body
      lastSentAt
      recipientsCount
    }
  }
}

query ListCampaignsStats {
  listCampaignsStats {
    total
    counts {
      field
      buckets {
        value
        count
      }
    }
    sums {
      field
      total
    }
  }
}

mutation CreateCampaign($input: CampaignInput!) {
  createCampaign(input: $input) {
    id
  }
}

mutation UpdateCampaign($id: ID!, $input: CampaignInput!) {
  updateCampaign(id: $id, input: $input) {
    id
  }
}

mutation DeleteCampaign($id: ID!) {
  deleteCampaign(id: $id)
}

mutation SendCampaign($id: ID!, $audienceListId: ID!) {
  sendCampaign(id: $id, audienceListId: $audienceListId) {
    sent
    failed
    campaign {
      id
      lastSentAt
      recipientsCount
    }
  }
}

fragment AudienceListFields on AudienceList {
  id
  name
  description
  clientIds
}

query ListAudienceLists {
  listAudienceLists {
    ...AudienceListFields
  }
}

query ListAudienceListsPaged($input: TableQueryInput!) {
  listAudienceListsPaged(input: $input) {
    totalCount
    rows {
      ...AudienceListFields
    }
  }
}

mutation CreateAudienceList($input: AudienceListInput!) {
  createAudienceList(input: $input) {
    id
  }
}

mutation UpdateAudienceList($id: ID!, $input: AudienceListInput!) {
  updateAudienceList(id: $id, input: $input) {
    id
  }
}

mutation DeleteAudienceList($id: ID!) {
  deleteAudienceList(id: $id)
}

query ListCampaignSends($campaignId: ID!) {
  listCampaignSends(campaignId: $campaignId) {
    id
    to
    recipientName
    status
    error
    sentAt
  }
}
