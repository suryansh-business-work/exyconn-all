fragment CampaignFields on Campaign {
  id
  name
  channel
  budget
  budgetCurrency
  startDate
  endDate
  status
  subject
  body
  templateKey
  lastSentAt
  recipientsCount
  scheduledAt
  scheduledAudienceListId
  scheduleDispatchedAt
  campaignType
  preferenceCategoryId
  senderName
  senderEmail
  replyTo
  preheader
  editorMode
  blocks
  mjml
  contentVersion
  trackOpens
  trackClicks
  sendState
  sendingRevisionId
}

query ListCampaigns {
  listCampaigns {
    ...CampaignFields
  }
}

query ListCampaignsPaged($input: TableQueryInput!) {
  listCampaignsPaged(input: $input) {
    totalCount
    rows {
      ...CampaignFields
    }
  }
}

query ListCampaignsStats {
  listCampaignsStats {
    total
    counts {
      field
      buckets {
        value
        count
      }
    }
    sums {
      field
      total
    }
  }
}

mutation CreateCampaign($input: CampaignInput!) {
  createCampaign(input: $input) {
    id
  }
}

mutation UpdateCampaign($id: ID!, $input: CampaignInput!) {
  updateCampaign(id: $id, input: $input) {
    id
  }
}

mutation DeleteCampaign($id: ID!) {
  deleteCampaign(id: $id)
}

query CampaignSendSummary($campaignId: ID!) {
  campaignSendSummary(campaignId: $campaignId) {
    sent
    failed
    skipped
  }
}

query CampaignOptions {
  campaignOptions {
    id
    name
  }
}

query LeadsByCampaign($campaignId: ID!) {
  leadsByCampaign(campaignId: $campaignId)
}

query CampaignLeadCounts {
  campaignLeadCounts {
    campaignId
    campaignName
    leads
  }
}

query ListCampaignSends($campaignId: ID!) {
  listCampaignSends(campaignId: $campaignId) {
    id
    to
    recipientName
    status
    error
    sentAt
  }
}

mutation UnsubscribeFromMarketing($token: String!) {
  unsubscribeFromMarketing(token: $token)
}

query CampaignMetrics($campaignId: ID!) {
  campaignMetrics(campaignId: $campaignId) {
    campaignId
    sent
    opened
    clicked
    totalOpens
    totalClicks
    openRate
    clickRate
    clickThroughRate
  }
  campaignTopLinks(campaignId: $campaignId) {
    url
    clicks
    people
  }
}
