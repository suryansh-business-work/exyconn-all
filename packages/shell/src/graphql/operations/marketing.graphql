fragment CampaignFields on Campaign {
  id
  name
  channel
  budget
  startDate
  endDate
  status
  subject
  body
  templateKey
  lastSentAt
  recipientsCount
  scheduledAt
  scheduledAudienceListId
  scheduleDispatchedAt
}

query ListCampaigns {
  listCampaigns {
    ...CampaignFields
  }
}

query ListCampaignsPaged($input: TableQueryInput!) {
  listCampaignsPaged(input: $input) {
    totalCount
    rows {
      ...CampaignFields
    }
  }
}

query ListCampaignsStats {
  listCampaignsStats {
    total
    counts {
      field
      buckets {
        value
        count
      }
    }
    sums {
      field
      total
    }
  }
}

mutation CreateCampaign($input: CampaignInput!) {
  createCampaign(input: $input) {
    id
  }
}

mutation UpdateCampaign($id: ID!, $input: CampaignInput!) {
  updateCampaign(id: $id, input: $input) {
    id
  }
}

mutation DeleteCampaign($id: ID!) {
  deleteCampaign(id: $id)
}

mutation SendCampaign($id: ID!, $audienceListId: ID, $testEmail: String) {
  sendCampaign(id: $id, audienceListId: $audienceListId, testEmail: $testEmail) {
    sent
    failed
    skipped
    campaign {
      id
      lastSentAt
      recipientsCount
    }
  }
}

query CampaignPreview($id: ID!, $audienceListId: ID!) {
  campaignPreview(id: $id, audienceListId: $audienceListId) {
    recipient
    subject
    body
  }
}

query CampaignSendSummary($campaignId: ID!) {
  campaignSendSummary(campaignId: $campaignId) {
    sent
    failed
    skipped
  }
}

query CampaignOptions {
  campaignOptions {
    id
    name
  }
}

query LeadsByCampaign($campaignId: ID!) {
  leadsByCampaign(campaignId: $campaignId)
}

query CampaignLeadCounts {
  campaignLeadCounts {
    campaignId
    campaignName
    leads
  }
}

