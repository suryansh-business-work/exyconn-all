query ListCampaigns {
  listCampaigns {
    id
    name
    channel
    budget
    startDate
    endDate
    status
    subject
    body
    lastSentAt
    recipientsCount
  }
}

query ListCampaignsPaged($input: TableQueryInput!) {
  listCampaignsPaged(input: $input) {
    totalCount
    rows {
      id
      name
      channel
      budget
      startDate
      endDate
      status
      subject
      body
      lastSentAt
      recipientsCount
    }
  }
}

query ListCampaignsStats {
  listCampaignsStats {
    total
    counts {
      field
      buckets {
        value
        count
      }
    }
    sums {
      field
      total
    }
  }
}

mutation CreateCampaign($input: CampaignInput!) {
  createCampaign(input: $input) {
    id
  }
}

mutation UpdateCampaign($id: ID!, $input: CampaignInput!) {
  updateCampaign(id: $id, input: $input) {
    id
  }
}

mutation DeleteCampaign($id: ID!) {
  deleteCampaign(id: $id)
}

mutation SendCampaign($id: ID!, $clientIds: [ID!]!) {
  sendCampaign(id: $id, clientIds: $clientIds) {
    sent
    failed
    campaign {
      id
      lastSentAt
      recipientsCount
    }
  }
}
