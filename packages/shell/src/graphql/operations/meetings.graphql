# CRM > Meetings: meeting types people book from a public link, and the bookings they make.
fragment MeetingTypeFields on MeetingType {
  id
  title
  slug
  bookingPath
  description
  durationMinutes
  location
  hostName
  hostEmail
  timezone
  weeklyHours {
    day
    enabled
    start
    end
  }
  bufferMinutes
  minNoticeHours
  maxDaysAhead
  active
  createdAt
}

query MeetingTypes {
  meetingTypes {
    ...MeetingTypeFields
  }
}

mutation CreateMeetingType($input: MeetingTypeInput!) {
  createMeetingType(input: $input) {
    ...MeetingTypeFields
  }
}

mutation UpdateMeetingType($id: ID!, $input: MeetingTypeInput!) {
  updateMeetingType(id: $id, input: $input) {
    ...MeetingTypeFields
  }
}

mutation DeleteMeetingType($id: ID!) {
  deleteMeetingType(id: $id)
}

fragment MeetingBookingFields on MeetingBooking {
  id
  meetingTypeId
  meetingTitle
  hostName
  startAt
  endAt
  name
  email
  notes
  guests
  timezone
  country
  status
  contactId
  createdAt
}

query MeetingBookings($page: Int!, $pageSize: Int!) {
  meetingBookings(page: $page, pageSize: $pageSize) {
    totalCount
    rows {
      ...MeetingBookingFields
    }
  }
}

mutation CancelMeetingBooking($id: ID!) {
  cancelMeetingBooking(id: $id) {
    ...MeetingBookingFields
  }
}

query MeetingBookingPagePath {
  meetingBookingPagePath
}

query MeetingSettings {
  meetingSettings {
    ...MeetingSettingsFields
  }
}

fragment MeetingSettingsFields on MeetingSettings {
  bookingSlug
  slackChannel
  googleMeetUrl
  zoomUrl
}

mutation SaveMeetingSettings($input: MeetingSettingsInput!) {
  saveMeetingSettings(input: $input) {
    ...MeetingSettingsFields
  }
}

query MeetingSlackChannels {
  meetingSlackChannels {
    id
    name
    isPrivate
    isMember
  }
}

query MeetingTracking($days: Int!) {
  meetingTracking(days: $days) {
    days
    views
    bookings
    byCountry {
      country
      countryName
      views
      bookings
    }
    byMeeting {
      meetingSlug
      views
      bookings
    }
    byDay {
      day
      views
      bookings
    }
    recent {
      id
      kind
      meetingSlug
      country
      countryName
      at
    }
  }
}

# The public booking pages (crm.exyconn.com/organization/:org/book/:page[/:slug]): no sign-in.
fragment PublicMeetingFields on PublicMeeting {
  slug
  title
  description
  durationMinutes
  hostName
  timezone
  organizationName
  organizationSlug
  logoUrl
  logoDarkUrl
  hasLocation
}

query PublicBookingPage($org: String!, $page: String!) {
  publicBookingPage(org: $org, page: $page) {
    organizationName
    organizationSlug
    logoUrl
    logoDarkUrl
    meetings {
      ...PublicMeetingFields
    }
  }
}

query PublicMeeting($org: String!, $page: String!, $slug: String!) {
  publicMeeting(org: $org, page: $page, slug: $slug) {
    ...PublicMeetingFields
  }
}

query PublicMeetingSlots(
  $org: String!
  $page: String!
  $slug: String!
  $from: DateTime!
  $to: DateTime!
) {
  publicMeetingSlots(org: $org, page: $page, slug: $slug, from: $from, to: $to)
}

mutation BookMeeting($org: String!, $page: String!, $slug: String!, $input: BookMeetingInput!) {
  bookMeeting(org: $org, page: $page, slug: $slug, input: $input) {
    title
    hostName
    startAt
    endAt
    location
    joinLinks
  }
}

mutation TrackMeetingView($org: String!, $page: String!, $slug: String!, $timezone: String) {
  trackMeetingView(org: $org, page: $page, slug: $slug, timezone: $timezone)
}
