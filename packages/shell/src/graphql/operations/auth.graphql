# The sign-in itself, and the second step for an account with two-factor on. Both return the
# same shape: one of them carries a session, the other carries a challenge.
fragment SignInResult on AuthPayload {
  token
  mfaRequired
  mfaChallenge
  user {
    id
    name
    email
    roles
    avatarUrl
  }
}

mutation Login($email: String!, $password: String!) {
  login(email: $email, password: $password) {
    ...SignInResult
  }
}

mutation VerifyMfa($challenge: String!, $code: String!) {
  verifyMfa(challenge: $challenge, code: $code) {
    ...SignInResult
  }
}

# Account settings: where this person is signed in, and whether a code is asked for.
query MySessions {
  mySessions {
    id
    userAgent
    ip
    lastSeenAt
    createdAt
    current
  }
}

query MyMfaStatus {
  myMfaStatus {
    enabled
    recoveryCodesLeft
    enrolledAt
  }
}

mutation RevokeSession($id: ID!) {
  revokeSession(id: $id)
}

mutation RevokeOtherSessions {
  revokeOtherSessions
}

mutation StartMfaEnrolment {
  startMfaEnrolment {
    secret
    uri
  }
}

mutation ConfirmMfaEnrolment($code: String!) {
  confirmMfaEnrolment(code: $code)
}

mutation DisableMfa($password: String!) {
  disableMfa(password: $password)
}

query Me {
  me {
    id
    name
    email
    roles
    avatarUrl
    timezone
    locale
    organizationId
    ...ProfileDetailsFields
  }
}

query AppSettings {
  appSettings {
    id
    dateFormat
    timeFormat
    timezone
    defaultLocale
    enabledLocales
    autoTranslate
    auditRetentionDays
    currency
    country
    fiscalYearStartMonth
    taxSystem
  }
}

mutation SendAdminCredentials {
  sendAdminCredentials
}

# The signed-in person's own working arrangement. Separate from `Me` on purpose: `Me` runs on
# every page load in every portal to establish the session, and it should not grow HR fields
# only two screens read.
query MyWorkProfile {
  me {
    id
    address
    brief
    workingTime
    workingTimeNote
    workLocation
    workLocationNote
    workHoursPerDay
  }
}

mutation RequestPasswordReset($email: String!) {
  requestPasswordReset(email: $email)
}

mutation ResetPassword($token: String!, $newPassword: String!) {
  resetPassword(token: $token, newPassword: $newPassword)
}
