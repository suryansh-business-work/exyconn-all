mutation Login($email: String!, $password: String!) {
  login(email: $email, password: $password) {
    token
    user {
      id
      name
      email
      roles
      avatarUrl
    }
  }
}

query Me {
  me {
    id
    name
    email
    roles
    avatarUrl
  }
}

query AppSettings {
  appSettings {
    id
    dateFormat
    timeFormat
    timezone
  }
}
