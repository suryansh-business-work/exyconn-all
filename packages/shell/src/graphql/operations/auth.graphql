mutation Login($email: String!, $password: String!) {
  login(email: $email, password: $password) {
    token
    user {
      id
      name
      email
      roles
      avatarUrl
    }
  }
}

query Me {
  me {
    id
    name
    email
    roles
    avatarUrl
    timezone
    locale
  }
}

query AppSettings {
  appSettings {
    id
    dateFormat
    timeFormat
    timezone
    defaultLocale
    enabledLocales
    autoTranslate
  }
}

mutation SendAdminCredentials {
  sendAdminCredentials
}

# The signed-in person's own working arrangement. Separate from `Me` on purpose: `Me` runs on
# every page load in every portal to establish the session, and it should not grow HR fields
# only two screens read.
query MyWorkProfile {
  me {
    id
    address
    brief
    workingTime
    workingTimeNote
    workLocation
    workLocationNote
    workHoursPerDay
  }
}

mutation RequestPasswordReset($email: String!) {
  requestPasswordReset(email: $email)
}

mutation ResetPassword($token: String!, $newPassword: String!) {
  resetPassword(token: $token, newPassword: $newPassword)
}
