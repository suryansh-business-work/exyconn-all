query ListSupportTickets {
  listSupportTickets {
    id
    employeeName
    subject
    category
    description
    priority
    status
    assigneeId
    assigneeName
    createdAt
  }
}

mutation SetSupportTicketStatus($id: ID!, $status: SupportStatus!) {
  setSupportTicketStatus(id: $id, status: $status) {
    id
    status
  }
}

fragment TicketAttachmentFields on TicketAttachment {
  url
  name
  contentType
  uploadedBy
  uploadedAt
}

query ListSupportReplies($ticketId: ID!) {
  listSupportReplies(ticketId: $ticketId) {
    id
    ticketId
    authorId
    authorName
    body
    internal
    createdAt
    attachments {
      ...TicketAttachmentFields
    }
  }
}

query ListSupportAgents {
  listSupportAgents {
    id
    name
    email
  }
}

mutation AssignSupportTicket($id: ID!, $assigneeId: String!) {
  assignSupportTicket(id: $id, assigneeId: $assigneeId) {
    id
    assigneeId
    assigneeName
  }
}

mutation AddSupportReply(
  $ticketId: ID!
  $body: String!
  $internal: Boolean!
  $attachments: [TicketAttachmentInput!]
) {
  addSupportReply(
    ticketId: $ticketId
    body: $body
    internal: $internal
    attachments: $attachments
  ) {
    id
  }
}

fragment SupportConsoleTicketFields on SupportTicket {
  id
  employeeId
  employeeName
  requesterType
  channel
  reference
  clientId
  clientName
  requesterName
  requesterEmail
  subject
  category
  description
  priority
  status
  assigneeId
  assigneeName
  dueAt
  firstRespondedAt
  resolvedAt
  slaState
  createdAt
  attachments {
    ...TicketAttachmentFields
  }
}

query GetSupportTicket($id: ID!) {
  getSupportTicket(id: $id) {
    ...SupportConsoleTicketFields
  }
}

query SupportSlaSummary {
  supportSlaSummary {
    onTrack
    dueSoon
    breached
  }
}

fragment SupportSlaPolicyFields on SupportSlaPolicy {
  id
  priority
  firstResponseMinutes
  resolutionMinutes
  active
}

query ListSupportSlaPoliciesPaged($input: TableQueryInput!) {
  listSupportSlaPoliciesPaged(input: $input) {
    totalCount
    rows {
      ...SupportSlaPolicyFields
    }
  }
}

query ListSupportSlaPoliciesStats {
  listSupportSlaPoliciesStats {
    total
    counts {
      field
      buckets {
        value
        count
      }
    }
    sums {
      field
      total
    }
  }
}

mutation CreateSupportSlaPolicy($input: SupportSlaPolicyInput!) {
  createSupportSlaPolicy(input: $input) {
    id
  }
}

mutation UpdateSupportSlaPolicy($id: ID!, $input: SupportSlaPolicyInput!) {
  updateSupportSlaPolicy(id: $id, input: $input) {
    id
  }
}

mutation DeleteSupportSlaPolicy($id: ID!) {
  deleteSupportSlaPolicy(id: $id)
}

mutation CreateClientSupportTicket($input: ClientSupportTicketInput!) {
  createClientSupportTicket(input: $input)
}

query ListSupportTicketsPaged($input: TableQueryInput!) {
  listSupportTicketsPaged(input: $input) {
    totalCount
    rows {
      ...SupportConsoleTicketFields
    }
  }
}

query ListSupportTicketsStats {
  listSupportTicketsStats {
    total
    counts {
      field
      buckets {
        value
        count
      }
    }
    sums {
      field
      total
    }
  }
}

mutation SetSupportTicketTriage(
  $id: ID!
  $category: SupportCategory!
  $priority: SupportPriority!
) {
  setSupportTicketTriage(id: $id, category: $category, priority: $priority) {
    id
    category
    priority
  }
}
