query ListSupportTickets {
  listSupportTickets {
    id
    employeeName
    subject
    category
    description
    priority
    status
    assigneeId
    assigneeName
    createdAt
  }
}

mutation SetSupportTicketStatus($id: ID!, $status: SupportStatus!) {
  setSupportTicketStatus(id: $id, status: $status) {
    id
    status
  }
}

query ListSupportReplies($ticketId: ID!) {
  listSupportReplies(ticketId: $ticketId) {
    id
    ticketId
    authorId
    authorName
    body
    internal
    createdAt
  }
}

query ListSupportAgents {
  listSupportAgents {
    id
    name
    email
  }
}

mutation AssignSupportTicket($id: ID!, $assigneeId: String!) {
  assignSupportTicket(id: $id, assigneeId: $assigneeId) {
    id
    assigneeId
    assigneeName
  }
}

mutation AddSupportReply($ticketId: ID!, $body: String!, $internal: Boolean!) {
  addSupportReply(ticketId: $ticketId, body: $body, internal: $internal) {
    id
  }
}

fragment SupportConsoleTicketFields on SupportTicket {
  id
  employeeId
  employeeName
  subject
  category
  description
  priority
  status
  assigneeId
  assigneeName
  createdAt
}

query ListSupportTicketsPaged($input: TableQueryInput!) {
  listSupportTicketsPaged(input: $input) {
    totalCount
    rows {
      ...SupportConsoleTicketFields
    }
  }
}

query ListSupportTicketsStats {
  listSupportTicketsStats {
    total
    counts {
      field
      buckets {
        value
        count
      }
    }
    sums {
      field
      total
    }
  }
}

mutation SetSupportTicketTriage($id: ID!, $category: SupportCategory!, $priority: SupportPriority!) {
  setSupportTicketTriage(id: $id, category: $category, priority: $priority) {
    id
    category
    priority
  }
}
