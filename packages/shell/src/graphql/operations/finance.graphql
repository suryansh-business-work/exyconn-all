query ListInvoices {
  listInvoices {
    id
    number
    clientId
    amount
    currency
    status
    issuedDate
    dueDate
    amountPaid
    balanceDue
  }
}

query ListInvoicesPaged($input: TableQueryInput!) {
  listInvoicesPaged(input: $input) {
    totalCount
    rows {
      id
      number
      clientId
      amount
      currency
      status
      issuedDate
      dueDate
      amountPaid
      balanceDue
    }
  }
}

query ListInvoicesStats {
  listInvoicesStats {
    total
    counts {
      field
      buckets {
        value
        count
      }
    }
    sums {
      field
      total
    }
  }
}

mutation CreateInvoice($input: InvoiceInput!) {
  createInvoice(input: $input) {
    id
  }
}

mutation UpdateInvoice($id: ID!, $input: InvoiceInput!) {
  updateInvoice(id: $id, input: $input) {
    id
  }
}

mutation DeleteInvoice($id: ID!) {
  deleteInvoice(id: $id)
}
