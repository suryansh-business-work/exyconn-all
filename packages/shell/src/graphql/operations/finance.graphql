fragment InvoiceFields on Invoice {
  id
  number
  clientId
  clientName
  lines {
    description
    quantity
    rate
    taxPercent
    hsnSac
    amount
  }
  amount
  currency
  status
  issuedDate
  dueDate
  sentAt
  amountPaid
  balanceDue
  dealId
  placeOfSupplyStateCode
  supplierStateCode
  subtotal
  taxTotal
  cgst
  sgst
  igst
}

query ListInvoices {
  listInvoices {
    ...InvoiceFields
  }
}

query ListInvoicesPaged($input: TableQueryInput!) {
  listInvoicesPaged(input: $input) {
    totalCount
    rows {
      ...InvoiceFields
    }
  }
}

query ListInvoicesStats {
  listInvoicesStats {
    total
    counts {
      field
      buckets {
        value
        count
      }
    }
    sums {
      field
      total
    }
  }
}

mutation CreateInvoice($input: InvoiceInput!) {
  createInvoice(input: $input) {
    id
  }
}

mutation UpdateInvoice($id: ID!, $input: InvoiceInput!) {
  updateInvoice(id: $id, input: $input) {
    id
  }
}

mutation DeleteInvoice($id: ID!) {
  deleteInvoice(id: $id)
}

query InvoicePdf($id: ID!) {
  invoicePdf(id: $id)
}

mutation SendInvoice($id: ID!, $email: String!, $message: String) {
  sendInvoice(id: $id, email: $email, message: $message) {
    id
    status
    sentAt
  }
}

query GstStates {
  gstStates {
    code
    name
  }
}

mutation CreateInvoiceFromDeal($dealId: ID!) {
  createInvoiceFromDeal(dealId: $dealId) {
    id
    number
  }
}
