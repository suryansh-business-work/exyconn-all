fragment TaskFields on Task {
  id
  columnId
  key
  title
  description
  type
  priority
  assigneeId
  assigneeName
  reporterName
  labels
  storyPoints
  dueDate
  order
  createdAt
  updatedAt
}

query ProjectBoard($projectId: ID!) {
  projectBoard(projectId: $projectId) {
    columns {
      id
      name
      order
    }
    tasks {
      ...TaskFields
    }
  }
}

query ProjectTasks($projectId: ID!) {
  projectTasks(projectId: $projectId) {
    ...TaskFields
  }
}

query TaskComments($taskId: ID!) {
  taskComments(taskId: $taskId) {
    id
    authorId
    authorName
    body
    createdAt
  }
}

query ListProjectMembers {
  listProjectMembers {
    id
    name
    email
  }
}

mutation CreateColumn($projectId: ID!, $name: String!) {
  createColumn(projectId: $projectId, name: $name) {
    id
  }
}

mutation RenameColumn($id: ID!, $name: String!) {
  renameColumn(id: $id, name: $name) {
    id
  }
}

mutation DeleteColumn($id: ID!) {
  deleteColumn(id: $id)
}

mutation ReorderColumns($projectId: ID!, $columnIds: [ID!]!) {
  reorderColumns(projectId: $projectId, columnIds: $columnIds)
}

mutation CreateTask($projectId: ID!, $columnId: ID!, $input: TaskInput!) {
  createTask(projectId: $projectId, columnId: $columnId, input: $input) {
    id
  }
}

mutation UpdateTask($id: ID!, $input: TaskInput!) {
  updateTask(id: $id, input: $input) {
    id
  }
}

mutation DeleteTask($id: ID!) {
  deleteTask(id: $id)
}

mutation MoveTask($id: ID!, $toColumnId: ID!, $toIndex: Int!) {
  moveTask(id: $id, toColumnId: $toColumnId, toIndex: $toIndex)
}

mutation AddTaskComment($taskId: ID!, $body: String!) {
  addTaskComment(taskId: $taskId, body: $body) {
    id
  }
}

mutation DeleteTaskComment($id: ID!) {
  deleteTaskComment(id: $id)
}

query GetProject($id: ID!) {
  getProject(id: $id) {
    id
    name
    key
    description
    status
  }
}
