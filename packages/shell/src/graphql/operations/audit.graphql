fragment AuditLogRow on AuditLog {
  id
  actorId
  actorName
  actorEmail
  action
  module
  entityId
  entityLabel
  summary
  changes
  ip
  createdAt
}

fragment AuditLogStats on TableStats {
  total
  counts {
    field
    buckets {
      value
      count
    }
  }
  sums {
    field
    total
  }
}

query ListAuditLogsPaged($input: TableQueryInput!) {
  listAuditLogsPaged(input: $input) {
    totalCount
    rows {
      ...AuditLogRow
    }
  }
}

query ListAuditLogsStats {
  listAuditLogsStats {
    ...AuditLogStats
  }
}

query ListFinanceChangeLogPaged($input: TableQueryInput!) {
  listFinanceChangeLogPaged(input: $input) {
    totalCount
    rows {
      ...AuditLogRow
    }
  }
}

query ListFinanceChangeLogStats {
  listFinanceChangeLogStats {
    ...AuditLogStats
  }
}
