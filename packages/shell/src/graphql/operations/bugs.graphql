query ListBugs {
  listBugs {
    id
    title
    description
    severity
    status
    projectId
    projectName
    assigneeId
    assigneeName
    taskId
    taskKey
    dueDate
  }
}

query ListBugsPaged($input: TableQueryInput!) {
  listBugsPaged(input: $input) {
    totalCount
    rows {
      id
      title
      description
      severity
      status
      projectId
      projectName
      assigneeId
      assigneeName
      taskId
      taskKey
      dueDate
    }
  }
}

query ListBugsStats {
  listBugsStats {
    total
    counts {
      field
      buckets {
        value
        count
      }
    }
    sums {
      field
      total
    }
  }
}

mutation CreateBug($input: BugInput!) {
  createBug(input: $input) {
    id
  }
}

mutation UpdateBug($id: ID!, $input: BugInput!) {
  updateBug(id: $id, input: $input) {
    id
  }
}

mutation DeleteBug($id: ID!) {
  deleteBug(id: $id)
}

mutation PromoteBugToTask($id: ID!) {
  promoteBugToTask(id: $id) {
    id
    key
  }
}
