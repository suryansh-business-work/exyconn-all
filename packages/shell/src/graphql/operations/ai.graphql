query ListAiJobs {
  listAiJobs {
    id
    name
    model
    prompt
    status
    totalTokens
  }
}

query GetAiJob($id: ID!) {
  getAiJob(id: $id) {
    id
    name
    model
    prompt
    status
    response
    error
    promptTokens
    completionTokens
    totalTokens
    costUsd
    latencyMs
    queuedAt
    ranAt
    createdByName
  }
}

query AiJobsInFlight {
  listAiJobs {
    id
    status
    queuedAt
  }
}

query AiModels {
  aiModels {
    models
    defaultModel
  }
}

query ListAiJobsPaged($input: TableQueryInput!) {
  listAiJobsPaged(input: $input) {
    totalCount
    rows {
      id
      name
      model
      prompt
      status
      totalTokens
      costUsd
      latencyMs
      queuedAt
      ranAt
      createdByName
    }
  }
}

query ListAiJobsStats {
  listAiJobsStats {
    total
    counts {
      field
      buckets {
        value
        count
      }
    }
    sums {
      field
      total
    }
  }
}

mutation CreateAiJob($input: AiJobInput!) {
  createAiJob(input: $input) {
    id
  }
}

mutation UpdateAiJob($id: ID!, $input: AiJobInput!) {
  updateAiJob(id: $id, input: $input) {
    id
  }
}

mutation DeleteAiJob($id: ID!) {
  deleteAiJob(id: $id)
}

mutation RunAiJob($id: ID!) {
  runAiJob(id: $id) {
    id
    status
    error
  }
}

mutation RunPrompt($id: ID!, $model: String!, $variables: [PromptVariableInput!]) {
  runPrompt(id: $id, model: $model, variables: $variables) {
    id
    name
    status
    error
  }
}

mutation AiSummarise($text: String!, $style: SummaryStyle) {
  aiSummarise(text: $text, style: $style)
}

mutation AiDraft($kind: AiDraftKind!, $context: String!) {
  aiDraft(kind: $kind, context: $context)
}

query AiSpendSummary($from: DateTime!, $to: DateTime!) {
  aiSpendSummary(from: $from, to: $to) {
    totalUsd
    byUser {
      userId
      name
      usd
      jobs
    }
    byModel {
      model
      usd
      jobs
    }
  }
}

query AiSpendLimit {
  aiSpendLimit {
    monthlyUsdCap
    perUserDailyUsdCap
    enabled
  }
}

query ListAiModelPrices {
  listAiModelPrices {
    id
    model
    inputPer1kUsd
    outputPer1kUsd
    active
    updatedAt
  }
}

mutation SaveAiModelPrice($input: AiModelPriceInput!) {
  saveAiModelPrice(input: $input) {
    id
  }
}

mutation DeleteAiModelPrice($id: ID!) {
  deleteAiModelPrice(id: $id)
}

mutation SaveAiSpendLimit($input: AiSpendLimitInput!) {
  saveAiSpendLimit(input: $input) {
    monthlyUsdCap
    perUserDailyUsdCap
    enabled
  }
}

query ListPrompts {
  listPrompts {
    id
    title
    category
    content
    description
    tags
    variables
  }
}

query ListPromptsPaged($input: TableQueryInput!) {
  listPromptsPaged(input: $input) {
    totalCount
    rows {
      id
      title
      category
      content
      description
      tags
      variables
    }
  }
}

query ListPromptsStats {
  listPromptsStats {
    total
    counts {
      field
      buckets {
        value
        count
      }
    }
    sums {
      field
      total
    }
  }
}

mutation CreatePrompt($input: PromptInput!) {
  createPrompt(input: $input) {
    id
  }
}

mutation UpdatePrompt($id: ID!, $input: PromptInput!) {
  updatePrompt(id: $id, input: $input) {
    id
  }
}

mutation DeletePrompt($id: ID!) {
  deletePrompt(id: $id)
}
