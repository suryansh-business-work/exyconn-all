query ListAiJobs {
  listAiJobs {
    id
    name
    model
    prompt
    status
    totalTokens
  }
}

query GetAiJob($id: ID!) {
  getAiJob(id: $id) {
    id
    name
    model
    prompt
    status
    response
    error
    promptTokens
    completionTokens
    totalTokens
    latencyMs
    ranAt
  }
}

query AiModels {
  aiModels {
    models
    defaultModel
  }
}

query ListAiJobsPaged($input: TableQueryInput!) {
  listAiJobsPaged(input: $input) {
    totalCount
    rows {
      id
      name
      model
      prompt
      status
      totalTokens
      latencyMs
      ranAt
    }
  }
}

query ListAiJobsStats {
  listAiJobsStats {
    total
    counts {
      field
      buckets {
        value
        count
      }
    }
    sums {
      field
      total
    }
  }
}

mutation CreateAiJob($input: AiJobInput!) {
  createAiJob(input: $input) {
    id
  }
}

mutation UpdateAiJob($id: ID!, $input: AiJobInput!) {
  updateAiJob(id: $id, input: $input) {
    id
  }
}

mutation DeleteAiJob($id: ID!) {
  deleteAiJob(id: $id)
}

mutation RunAiJob($id: ID!) {
  runAiJob(id: $id) {
    id
    status
    error
  }
}

mutation RunPrompt($id: ID!, $model: String!) {
  runPrompt(id: $id, model: $model) {
    id
    name
    status
    response
    error
    totalTokens
    latencyMs
  }
}

query ListPrompts {
  listPrompts {
    id
    title
    category
    content
    description
    tags
  }
}

query ListPromptsPaged($input: TableQueryInput!) {
  listPromptsPaged(input: $input) {
    totalCount
    rows {
      id
      title
      category
      content
      description
      tags
    }
  }
}

query ListPromptsStats {
  listPromptsStats {
    total
    counts {
      field
      buckets {
        value
        count
      }
    }
    sums {
      field
      total
    }
  }
}

mutation CreatePrompt($input: PromptInput!) {
  createPrompt(input: $input) {
    id
  }
}

mutation UpdatePrompt($id: ID!, $input: PromptInput!) {
  updatePrompt(id: $id, input: $input) {
    id
  }
}

mutation DeletePrompt($id: ID!) {
  deletePrompt(id: $id)
}
