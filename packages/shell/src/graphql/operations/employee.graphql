fragment PayrollFields on SalaryStructure {
  id
  currency
  basic
  hra
  allowances
  deductions
  gross
  net
  effectiveFrom
}

fragment SalarySlipFields on SalarySlip {
  id
  month
  year
  currency
  gross
  deductions
  net
  status
  issuedDate
}

fragment HolidayFields on Holiday {
  id
  name
  date
  type
  description
}

fragment SupportTicketFields on SupportTicket {
  id
  reference
  subject
  category
  description
  priority
  status
  createdAt
  attachments {
    ...TicketAttachmentFields
  }
}

query MyPayroll {
  myPayroll {
    ...PayrollFields
  }
}

query MySalarySlips {
  mySalarySlips {
    ...SalarySlipFields
  }
}

query ListHolidays {
  listHolidays {
    ...HolidayFields
  }
}

query MySupportTickets {
  mySupportTickets {
    ...SupportTicketFields
  }
}

mutation CreateSupportTicket($input: SupportTicketInput!) {
  createSupportTicket(input: $input) {
    id
  }
}

query MySupportReplies($ticketId: ID!) {
  mySupportReplies(ticketId: $ticketId) {
    id
    ticketId
    authorId
    authorName
    body
    createdAt
    attachments {
      ...TicketAttachmentFields
    }
  }
}

mutation AddMySupportReply($ticketId: ID!, $body: String!, $attachments: [TicketAttachmentInput!]) {
  addMySupportReply(ticketId: $ticketId, body: $body, attachments: $attachments) {
    id
  }
}
