# Google Maps: the keys in Tech > Environment Variables, the CRM lead generator
# (CRM > Tools > Lead generator) and the map on a company or contact.

fragment GoogleMapsConfigFields on GoogleMapsConfig {
  id
  label
  hasBrowserKey
  browserKeyHint
  hasServerKey
  serverKeyHint
  isActive
  updatedAt
}

query GoogleMapsConfigs {
  googleMapsConfigs {
    ...GoogleMapsConfigFields
  }
}

mutation CreateGoogleMapsConfig($input: GoogleMapsConfigInput!) {
  createGoogleMapsConfig(input: $input) {
    id
  }
}

mutation UpdateGoogleMapsConfig($id: ID!, $input: GoogleMapsConfigInput!) {
  updateGoogleMapsConfig(id: $id, input: $input) {
    id
  }
}

mutation TestGoogleMapsConfig($id: ID!) {
  testGoogleMapsConfig(id: $id)
}

mutation DeleteGoogleMapsConfig($id: ID!) {
  deleteGoogleMapsConfig(id: $id)
}

query GoogleMapsClientConfig {
  googleMapsClientConfig {
    browserKey
    placesReady
  }
}

fragment LeadPlaceFields on LeadPlace {
  placeId
  name
  address
  city
  country
  phone
  website
  rating
  ratingCount
  lat
  lng
  mapUrl
  primaryType
  existingCompanyId
}

query SearchLeadPlaces($input: LeadSearchInput!) {
  searchLeadPlaces(input: $input) {
    nextPageToken
    places {
      ...LeadPlaceFields
    }
  }
}

mutation FindLeadEmails($website: String!) {
  findLeadEmails(website: $website) {
    emails
    status
    message
  }
}

fragment LeadImportExtraFields on LeadImportExtra {
  field
  label
  current
  incoming
}

query PreviewLeadImport($leads: [LeadImportInput!]!) {
  previewLeadImport(leads: $leads) {
    placeId
    name
    status
    existingCompanyId
    existingName
    extras {
      ...LeadImportExtraFields
    }
  }
}

mutation ImportLeadsToCrm($leads: [LeadImportInput!]!, $mergeInto: [LeadMergeInput!]) {
  importLeadsToCrm(leads: $leads, mergeInto: $mergeInto) {
    created
    skipped
    merged
    filed {
      placeId
      companyId
    }
    merges {
      placeId
      companyId
      name
      added {
        ...LeadImportExtraFields
      }
    }
    skips {
      placeId
      name
      reason
      companyId
    }
  }
}

query LeadLocationSuggestions($input: String!) {
  leadLocationSuggestions(input: $input) {
    placeId
    text
    mainText
    secondaryText
  }
}
