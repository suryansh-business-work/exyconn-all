query ListClients {
  listClients {
    id
    name
    email
    phone
    company
    status
    country
    currency
    taxIdType
    taxId
    taxIdLabel
    gstin
    stateCode
    region
    city
    postalCode
    billingAddress
  }
}

query ListClientsPaged($input: TableQueryInput!) {
  listClientsPaged(input: $input) {
    totalCount
    rows {
      id
      name
      email
      phone
      company
      status
      country
      currency
      taxIdType
      taxId
      taxIdLabel
      gstin
      stateCode
      region
      city
      postalCode
      billingAddress
    }
  }
}

query ListClientsStats {
  listClientsStats {
    total
    counts {
      field
      buckets {
        value
        count
      }
    }
    sums {
      field
      total
    }
  }
}

mutation CreateClient($input: ClientInput!) {
  createClient(input: $input) {
    id
  }
}

mutation UpdateClient($id: ID!, $input: ClientInput!) {
  updateClient(id: $id, input: $input) {
    id
  }
}

mutation DeleteClient($id: ID!) {
  deleteClient(id: $id)
}

query GetClient($id: ID!) {
  getClient(id: $id) {
    id
    name
    email
    company
  }
}

query ClientProjectOptions {
  clientProjectOptions {
    id
    name
    key
    clientId
    clientName
  }
}

mutation SetClientProjects($clientId: ID!, $projectIds: [ID!]!) {
  setClientProjects(clientId: $clientId, projectIds: $projectIds)
}
