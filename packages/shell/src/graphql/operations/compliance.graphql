fragment RiskFields on Risk {
  id
  reference
  title
  description
  standards
  category
  subject
  ownerId
  ownerName
  likelihood
  impact
  inherentScore
  inherentLevel
  treatment
  controls
  residualLikelihood
  residualImpact
  residualScore
  residualLevel
  status
  identifiedOn
  reviewDueOn
  closedOn
}

fragment ObjectiveFields on Objective {
  id
  title
  description
  standards
  category
  scope
  area
  ownerId
  ownerName
  measure
  unit
  baseline
  target
  actual
  achievementPercent
  frequency
  periodStart
  periodEnd
  status
  plan
}

fragment InternalAuditFields on InternalAudit {
  id
  reference
  title
  kind
  standards
  scope
  criteria
  leadAuditorId
  leadAuditorName
  auditeeName
  plannedOn
  performedOn
  status
  summary
  conclusion
}

fragment FindingFields on Finding {
  id
  reference
  title
  description
  source
  auditId
  riskId
  standards
  category
  clause
  type
  immediateAction
  rootCause
  correctiveAction
  ownerId
  ownerName
  raisedOn
  dueOn
  status
  verifiedOn
  verifiedByName
  effective
  effectivenessNote
  closedOn
}

fragment ManagementReviewFields on ManagementReview {
  id
  reference
  title
  standards
  heldOn
  chairName
  attendees
  inputs
  decisions
  actions {
    description
    ownerName
    dueOn
    done
  }
  openActionCount
  status
}

fragment ComplianceStatsFields on TableStats {
  total
  counts {
    field
    buckets {
      value
      count
    }
  }
  sums {
    field
    total
  }
}

query ListRisksPaged($input: TableQueryInput!) {
  listRisksPaged(input: $input) {
    rows {
      ...RiskFields
    }
    totalCount
  }
}

query ListRisksStats {
  listRisksStats {
    ...ComplianceStatsFields
  }
}

query ListRisks {
  listRisks {
    id
    reference
    title
  }
}

mutation CreateRisk($input: RiskInput!) {
  createRisk(input: $input) {
    id
  }
}

mutation UpdateRisk($id: ID!, $input: RiskInput!) {
  updateRisk(id: $id, input: $input) {
    id
  }
}

mutation DeleteRisk($id: ID!) {
  deleteRisk(id: $id)
}

