# The AI calling bot demo (demos.exyconn.com/calling-bot-demo) and its settings in Tech > Demos.

fragment CallingBotCallFields on CallingBotCall {
  id
  channel
  status
  phone
  languageCode
  answeredAt
  endedAt
  endReason
  scenarioTitle
  createdAt
  transcript {
    role
    text
    at
  }
}

query CallingBotAvailability {
  callingBotAvailability {
    available
    phoneEnabled
    languageCode
    maxCallSeconds
  }
}

# The examples a caller picks from on the demo.
query CallingBotScenarioOptions {
  callingBotScenarioOptions {
    id
    title
    description
    languageCode
  }
}

mutation StartCallingBotCall($input: StartCallingBotCallInput!) {
  startCallingBotCall(input: $input) {
    socketUrl
    call {
      ...CallingBotCallFields
    }
  }
}

query CallingBotCall($id: ID!) {
  callingBotCall(id: $id) {
    ...CallingBotCallFields
  }
}

# Tech › Demos › Calling bot.
query CallingBotConfigs {
  callingBotConfigs {
    id
    label
    hasSarvamApiKey
    sarvamApiKeyHint
    hasOpenAiApiKey
    openAiApiKeyHint
    openAiModel
    systemPrompt
    greeting
    languageCode
    ttsModel
    ttsSpeaker
    maxCallSeconds
    phoneProvider
    vobizAuthId
    hasVobizAuthToken
    vobizNumber
    twilioAccountSid
    hasTwilioAuthToken
    twilioNumber
    phoneEnabled
    isActive
    updatedAt
  }
}

mutation CreateCallingBotConfig($input: CallingBotConfigInput!) {
  createCallingBotConfig(input: $input) {
    id
  }
}

mutation UpdateCallingBotConfig($id: ID!, $input: CallingBotConfigInput!) {
  updateCallingBotConfig(id: $id, input: $input) {
    id
  }
}

mutation DeleteCallingBotConfig($id: ID!) {
  deleteCallingBotConfig(id: $id)
}

mutation RevealCallingBotSecret($id: ID!, $secret: CallingBotSecret!) {
  revealCallingBotSecret(id: $id, secret: $secret)
}

mutation TestCallingBotKey($input: CallingBotKeyTestInput!) {
  testCallingBotKey(input: $input)
}

mutation TestCallingBotConfig($id: ID!) {
  testCallingBotConfig(id: $id)
}

query CallingBotRecentCalls($limit: Int) {
  callingBotRecentCalls(limit: $limit) {
    callerName
    callerEmail
    ...CallingBotCallFields
  }
}

# Tech › Demos › Calling bot › Examples.
query CallingBotScenarios {
  callingBotScenarios {
    id
    title
    description
    systemPrompt
    greeting
    languageCode
    enabled
    order
    updatedAt
  }
}

mutation CreateCallingBotScenario($input: CallingBotScenarioInput!) {
  createCallingBotScenario(input: $input) {
    id
  }
}

mutation UpdateCallingBotScenario($id: ID!, $input: CallingBotScenarioInput!) {
  updateCallingBotScenario(id: $id, input: $input) {
    id
  }
}

mutation DeleteCallingBotScenario($id: ID!) {
  deleteCallingBotScenario(id: $id)
}

# Tech > Demos > Calling bot > Call flows: each example with its drawn flow and compiled script.
query CallingBotScenarioFlows {
  callingBotScenarios {
    id
    title
    description
    greeting
    enabled
    flow
    callScript
    updatedAt
  }
}

mutation SaveCallingBotScenarioFlow($id: ID!, $flow: JSON) {
  saveCallingBotScenarioFlow(id: $id, flow: $flow) {
    id
    flow
    callScript
    updatedAt
  }
}
