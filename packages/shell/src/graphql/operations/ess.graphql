# Employee self-service: everything an employee reads or does for themselves.

query MyNotifications {
  myNotifications {
    id
    kind
    title
    body
    link
    read
    createdAt
  }
}

query MyUnreadNotificationCount {
  myUnreadNotificationCount
}

mutation MarkNotificationRead($id: ID!) {
  markNotificationRead(id: $id)
}

mutation MarkAllNotificationsRead {
  markAllNotificationsRead
}

query MyRequests {
  myRequests {
    id
    type
    subject
    details
    status
    decisionNote
    decidedAt
    createdAt
  }
}

mutation CreateMyRequest($input: MyRequestInput!) {
  createMyRequest(input: $input) {
    id
  }
}

# The manager's side: what direct reports have asked for, and the decisions on it.

query TeamRequests {
  teamRequests {
    id
    employeeId
    type
    subject
    details
    status
    decisionNote
    createdAt
  }
}

mutation DecideEmployeeRequest($id: ID!, $status: RequestStatus!, $decisionNote: String) {
  decideEmployeeRequest(id: $id, status: $status, decisionNote: $decisionNote) {
    id
    status
  }
}

query TeamGoals {
  teamGoals {
    id
    employeeId
    title
    kpi
    weightage
    endDate
    progress
    status
    managerComment
  }
}

mutation CommentOnTeamGoal($id: ID!, $comment: String!) {
  commentOnTeamGoal(id: $id, comment: $comment) {
    id
    managerComment
  }
}

query TeamPerformanceReviews {
  teamPerformanceReviews {
    id
    employeeId
    cycle
    selfAssessment
    managerAssessment
    score
    status
    updatedAt
  }
}

mutation SubmitManagerAssessment($id: ID!, $managerAssessment: String!, $score: Int) {
  submitManagerAssessment(id: $id, managerAssessment: $managerAssessment, score: $score) {
    id
    status
  }
}

query MyGoals {
  myGoals {
    id
    title
    description
    kpi
    weightage
    startDate
    endDate
    progress
    status
    managerComment
  }
}

mutation UpdateMyGoalProgress($id: ID!, $progress: Int!) {
  updateMyGoalProgress(id: $id, progress: $progress) {
    id
    progress
  }
}

query MyPerformanceReviews {
  myPerformanceReviews {
    id
    cycle
    selfAssessment
    managerAssessment
    competencies
    score
    rating
    actionPlan
    status
    updatedAt
  }
}

mutation SubmitSelfAssessment($id: ID!, $text: String!) {
  submitSelfAssessment(id: $id, text: $text) {
    id
    status
  }
}

query MyExpenseClaims {
  myExpenseClaims {
    id
    category
    description
    amount
    currency
    incurredOn
    receiptUrl
    status
    approvedAmount
  }
}

mutation CreateMyExpenseClaim($input: MyExpenseClaimInput!) {
  createMyExpenseClaim(input: $input) {
    id
  }
}

query MyBenefits {
  myBenefits {
    id
    kind
    name
    provider
    reference
    coverage
    validFrom
    validTo
    documentUrl
  }
}

query MyTrainings {
  myTrainings {
    id
    title
    provider
    category
    assignedOn
    dueOn
    completedOn
    status
    certificateUrl
  }
}

mutation UpdateMyTrainingStatus($id: ID!, $status: TrainingStatus!) {
  updateMyTrainingStatus(id: $id, status: $status) {
    id
    status
    completedOn
  }
}

query MyDocuments {
  myDocuments {
    id
    kind
    title
    url
    issuedOn
  }
}

mutation SendNotification($input: SendNotificationInput!) {
  sendNotification(input: $input) {
    recipients
  }
}
