# Payroll administration (HR / Finance).

fragment SalaryStructureFields on SalaryStructure {
  id
  employeeId
  currency
  payType
  payTypeNote
  basic
  hra
  allowances
  deductions
  rate
  billingRate
  gross
  net
  effectiveFrom
}

query ListSalaryStructuresPaged($input: TableQueryInput!) {
  listSalaryStructuresPaged(input: $input) {
    totalCount
    rows {
      ...SalaryStructureFields
    }
  }
}

# One employee's compensation, for the HR employee record. Null until HR sets it up.
query EmployeeSalary($employeeId: ID!) {
  employeeSalary(employeeId: $employeeId) {
    ...SalaryStructureFields
  }
}

mutation SaveEmployeeSalary($employeeId: ID!, $input: EmployeeSalaryInput!) {
  saveEmployeeSalary(employeeId: $employeeId, input: $input) {
    ...SalaryStructureFields
  }
}

query ListSalaryStructuresStats {
  listSalaryStructuresStats {
    total
    counts {
      field
      buckets {
        value
        count
      }
    }
    sums {
      field
      total
    }
  }
}

mutation CreateSalaryStructure($input: SalaryStructureInput!) {
  createSalaryStructure(input: $input) {
    id
  }
}

mutation UpdateSalaryStructure($id: ID!, $input: SalaryStructureInput!) {
  updateSalaryStructure(id: $id, input: $input) {
    id
  }
}

mutation DeleteSalaryStructure($id: ID!) {
  deleteSalaryStructure(id: $id)
}

query ListSalarySlipsPaged($input: TableQueryInput!) {
  listSalarySlipsPaged(input: $input) {
    totalCount
    rows {
      id
      employeeId
      month
      year
      currency
      gross
      deductions
      net
      status
      issuedDate
    }
  }
}

query PayrollSummary($month: Int!, $year: Int!) {
  payrollSummary(month: $month, year: $year) {
    month
    year
    slips
    paid
    totalGross
    totalDeductions
    totalNet
  }
}

mutation RunPayroll($month: Int!, $year: Int!) {
  runPayroll(month: $month, year: $year) {
    generated
    updated
    skipped
    totalNet
  }
}

mutation MarkPayrollPaid($month: Int!, $year: Int!) {
  markPayrollPaid(month: $month, year: $year)
}

query SalarySlipPdf($id: ID!) {
  salarySlipPdf(id: $id) {
    filename
    contentType
    contentBase64
  }
}

query PayrollSchedule {
  payrollSchedule {
    enabled
    dayOfMonth
    hour
    minute
    period
    lastRunAt
    lastRunPeriod
    lastSent
    lastFailed
    lastSkipped
  }
}

mutation UpdatePayrollSchedule($input: PayrollScheduleInput!) {
  updatePayrollSchedule(input: $input) {
    enabled
    dayOfMonth
    hour
    minute
    period
    lastRunAt
    lastRunPeriod
    lastSent
    lastFailed
    lastSkipped
  }
}

mutation SendSalarySlips($month: Int!, $year: Int!) {
  sendSalarySlips(month: $month, year: $year) {
    month
    year
    sent
    failed
    skipped
  }
}
