query ListContracts {
  listContracts {
    id
    title
    party
    type
    effectiveDate
    expiryDate
    status
    documentUrl
    sentAt
    signedBy
    signedAt
  }
}

query ListContractsPaged($input: TableQueryInput!) {
  listContractsPaged(input: $input) {
    totalCount
    rows {
      id
      title
      party
      type
      effectiveDate
      expiryDate
      status
      documentUrl
      sentAt
      signedBy
      signedAt
    }
  }
}

query ListContractsStats {
  listContractsStats {
    total
    counts {
      field
      buckets {
        value
        count
      }
    }
    sums {
      field
      total
    }
  }
}

mutation CreateContract($input: ContractInput!) {
  createContract(input: $input) {
    id
  }
}

mutation UpdateContract($id: ID!, $input: ContractInput!) {
  updateContract(id: $id, input: $input) {
    id
  }
}

mutation DeleteContract($id: ID!) {
  deleteContract(id: $id)
}

# Asking a counterparty to sign: they get a link that identifies them, and Legal gets the
# same link back so it can be passed on by hand when email is not the route.
mutation RequestContractSignature(
  $contractId: ID!
  $signerName: String!
  $signerEmail: String!
  $message: String
) {
  requestContractSignature(
    contractId: $contractId
    signerName: $signerName
    signerEmail: $signerEmail
    message: $message
  ) {
    id
    url
  }
}

mutation RevokeContractSignature($id: ID!) {
  revokeContractSignature(id: $id)
}

# Our own side. The signer is the account making the request, so there is nothing to type.
mutation SignContract($id: ID!) {
  signContract(id: $id) {
    id
    signedBy
    signedAt
    status
  }
}

query ContractSignatures($contractId: ID!) {
  contractSignatures(contractId: $contractId) {
    id
    signerName
    signerEmail
    requestedByName
    expiresAt
    revokedAt
    signedAt
    signedName
    signedIp
    signedUserAgent
    documentSha256
    createdAt
  }
}

# The public signing page: what the counterparty behind a link is shown, and the signature.
query ContractToSign($token: String!) {
  contractToSign(token: $token) {
    title
    party
    type
    effectiveDate
    expiryDate
    documentUrl
    signerName
    signedAt
  }
}

mutation SignContractWithToken($token: String!, $signedName: String!) {
  signContractWithToken(token: $token, signedName: $signedName) {
    signedAt
    documentSha256
  }
}

