# The CRM's Gmail: the OAuth client on Tech > Environment Variables, the accounts connected in
# CRM > Connect Gmail, and emailing from a record.
fragment GmailConfigFields on GmailConfig {
  id
  clientId
  hasClientSecret
  clientSecretHint
  enabled
  accountCount
  redirectUri
  updatedAt
}

query GmailConfig {
  gmailConfig {
    ...GmailConfigFields
  }
}

mutation SaveGmailConfig($input: GmailConfigInput!) {
  saveGmailConfig(input: $input) {
    ...GmailConfigFields
  }
}

mutation UseGoogleSignInClientForGmail {
  useGoogleSignInClientForGmail {
    ...GmailConfigFields
  }
}

mutation StartGmailConnect($returnTo: String!, $loginHint: String) {
  startGmailConnect(returnTo: $returnTo, loginHint: $loginHint)
}

fragment GmailAccountFields on GmailAccount {
  id
  email
  enabled
  status
  lastError
  lastErrorAt
  connectedAt
  connectedByName
  lastSyncAt
}

query GmailAccounts {
  gmailAccounts {
    ...GmailAccountFields
  }
  gmailClientReady
}

mutation SetGmailAccountEnabled($id: ID!, $enabled: Boolean!) {
  setGmailAccountEnabled(id: $id, enabled: $enabled) {
    ...GmailAccountFields
  }
}

mutation TestGmailAccount($id: ID!) {
  testGmailAccount(id: $id) {
    ...GmailAccountFields
  }
}

mutation DisconnectGmailAccount($id: ID!) {
  disconnectGmailAccount(id: $id)
}

mutation TestGmailConfig {
  testGmailConfig
}

fragment CrmEmailMessageFields on CrmEmailMessage {
  id
  gmailId
  threadId
  messageId
  direction
  from
  to
  cc
  subject
  snippet
  bodyText
  sentAt
  sentByName
  accountId
  mailbox
}

query CrmGmailReady {
  crmGmailReady
}

query CrmEmailSender($object: CrmTimelineObject!, $id: ID!) {
  crmEmailSender(object: $object, id: $id)
}

query CrmEmailThreadPage(
  $object: CrmTimelineObject!
  $id: ID!
  $input: CrmEmailThreadPageInput!
) {
  crmEmailThreadPage(object: $object, id: $id, input: $input) {
    totalCount
    mailboxes {
      accountId
      mailbox
    }
    rows {
      threadId
      accountId
      mailbox
      subject
      lastAt
      messages {
        ...CrmEmailMessageFields
      }
    }
  }
}

mutation SyncCrmEmails($object: CrmTimelineObject!, $id: ID!) {
  syncCrmEmails(object: $object, id: $id)
}

mutation SendCrmEmail($input: SendCrmEmailInput!) {
  sendCrmEmail(input: $input) {
    ...CrmEmailMessageFields
  }
}

mutation DraftCrmEmail($input: DraftCrmEmailInput!) {
  draftCrmEmail(input: $input)
}

mutation CrmRecordSummary($object: CrmTimelineObject!, $id: ID!) {
  crmRecordSummary(object: $object, id: $id)
}
