query McpServers {
  mcpServers {
    endpoint
    label
    description
    serverUrl
    toolCount
    queryCount
    mutationCount
    connectionCount
  }
}

query McpTools($endpoint: McpEndpoint!) {
  mcpTools(endpoint: $endpoint) {
    server
    name
    kind
    description
    arguments {
      name
      type
      required
      description
    }
  }
}

query McpUsage($endpoint: McpEndpoint!, $days: Int!) {
  mcpUsage(endpoint: $endpoint, days: $days) {
    calls
    failures
    people
    days {
      day
      calls
      failures
    }
    tools {
      tool
      calls
      failures
      averageMs
    }
    users {
      userName
      calls
    }
  }
}

query McpActivity($endpoint: McpEndpoint!, $days: Int!, $limit: Int) {
  mcpActivity(endpoint: $endpoint, days: $days, limit: $limit) {
    id
    server
    at
    userName
    clientName
    tool
    kind
    ok
    error
    durationMs
  }
}

query McpConnections($endpoint: McpEndpoint!) {
  mcpConnections(endpoint: $endpoint) {
    id
    endpoint
    clientName
    userName
    createdAt
    lastUsedAt
  }
}

query McpAuthorizationRequest($id: ID!) {
  mcpAuthorizationRequest(id: $id) {
    id
    endpoint
    serverLabel
    clientName
    redirectHost
    scopes
  }
}

mutation ApproveMcpAuthorization($id: ID!) {
  approveMcpAuthorization(id: $id)
}

mutation DenyMcpAuthorization($id: ID!) {
  denyMcpAuthorization(id: $id)
}

mutation RevokeMcpConnection($id: ID!) {
  revokeMcpConnection(id: $id)
}
