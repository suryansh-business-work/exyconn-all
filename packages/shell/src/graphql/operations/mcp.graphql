query McpServers {
  mcpServers {
    endpoint
    label
    description
    serverUrl
    toolCount
    queryCount
    mutationCount
    connectionCount
  }
}

query McpTools($endpoint: McpEndpoint!) {
  mcpTools(endpoint: $endpoint) {
    server
    name
    kind
    description
    arguments {
      name
      type
      required
      description
    }
  }
}

query McpUsage($endpoint: McpEndpoint!, $days: Int!) {
  mcpUsage(endpoint: $endpoint, days: $days) {
    calls
    failures
    writes
    people
    p50Ms
    p95Ms
    days {
      day
      calls
      failures
    }
    tools {
      tool
      calls
      failures
      averageMs
      p95Ms
      lastAt
    }
    users {
      userName
      calls
    }
    clients {
      clientName
      calls
    }
    servers {
      server
      calls
    }
    errorCodes {
      code
      count
    }
  }
}

query McpActivity(
  $endpoint: McpEndpoint!
  $days: Int!
  $limit: Int
  $ok: Boolean
  $search: String
) {
  mcpActivity(endpoint: $endpoint, days: $days, limit: $limit, ok: $ok, search: $search) {
    id
    server
    at
    userName
    clientName
    tool
    kind
    ok
    error
    errorCode
    durationMs
    traceId
    endpoint
    argNames
    answerChars
    truncated
  }
}

query McpErrors($endpoint: McpEndpoint!, $days: Int!) {
  mcpErrors(endpoint: $endpoint, days: $days) {
    server
    tool
    errorCode
    error
    count
    people
    firstAt
    lastAt
    lastTraceId
  }
}

query McpConnections($endpoint: McpEndpoint!) {
  mcpConnections(endpoint: $endpoint) {
    id
    endpoint
    clientName
    userName
    createdAt
    lastUsedAt
  }
}

query McpAuthorizationRequest($id: ID!) {
  mcpAuthorizationRequest(id: $id) {
    id
    endpoint
    serverLabel
    clientName
    redirectHost
    scopes
  }
}

mutation ApproveMcpAuthorization($id: ID!) {
  approveMcpAuthorization(id: $id)
}

mutation DenyMcpAuthorization($id: ID!) {
  denyMcpAuthorization(id: $id)
}

mutation RevokeMcpConnection($id: ID!) {
  revokeMcpConnection(id: $id)
}
