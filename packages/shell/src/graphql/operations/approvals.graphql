# The shared approval queue: everything awaiting the signed-in user, across every module.

query MyApprovals($kind: String) {
  myApprovals(kind: $kind) {
    totalCount
    groups {
      kind
      label
      count
    }
    items {
      id
      kind
      kindLabel
      title
      summary
      requestedById
      requestedByName
      requestedAt
      link
      amount
      currency
    }
  }
}

query MyPendingApprovalCount {
  myPendingApprovalCount
}

mutation DecideApproval($id: ID!, $decision: ApprovalDecision!, $note: String) {
  decideApproval(id: $id, decision: $decision, note: $note)
}

# Covering somebody's approvals while they are away, and what somebody has arranged.
query MyApprovalDelegations {
  myApprovalDelegations {
    given {
      id
      toEmployeeId
      toName
      fromDate
      toDate
      note
      active
    }
    held {
      id
      fromEmployeeId
      fromName
      fromDate
      toDate
      note
      active
    }
  }
}

mutation DelegateApprovals($input: ApprovalDelegationInput!) {
  delegateApprovals(input: $input) {
    id
    toName
    fromDate
    toDate
    active
  }
}

mutation EndApprovalDelegation($id: ID!) {
  endApprovalDelegation(id: $id)
}
