fragment TrackerAccessFields on TrackerAccess {
  id
  userId
  grantedBy
  grantedAt
  revokedAt
  isActive
  consentedAt
  timezone
}

fragment TrackerDeviceFields on TrackerDevice {
  id
  userId
  deviceId
  platform
  hostname
  appVersion
  machineId
  osName
  osVersion
  arch
  cpuModel
  cpuCores
  totalMemoryMb
  locale
  timezone
  screenCount
  screenResolution
  issuedAt
  lastSeenAt
  revokedAt
  isActive
}

fragment TrackerSettingsFields on TrackerSettings {
  id
  intervalMinutes
  screenshotsPerInterval
  randomizeScreenshotTiming
  blurScreenshots
  trackWindowTitles
  idleThresholdSeconds
  idleAutoPauseMinutes
  screenshotMaxWidth
  screenshotQuality
  screenshotRetentionDays
  autoStartEnabled
  autoStartHour
  autoStopHour
  dailyDigestEnabled
  weeklyDigestEnabled
  digestHour
  employeeDailyReportEnabled
  employeeWeeklyReportEnabled
  employeeMonthlyReportEnabled
  employeeReportHour
  captureSoundEnabled
  webcamEnabled
  webcamCorner
  syncIntervalMinutes
  consentText
  consentPolicySlug
  defaultTimezone
}

fragment TrackerDayBucketFields on TrackerDayBucket {
  date
  activeMs
  idleMs
  manualMs
  keyCount
  mouseCount
  sessions
}

fragment TrackerDayFields on TrackerDay {
  intervals {
    id
    sessionId
    startedAt
    endedAt
    keyCount
    mouseCount
    activeMs
    idleMs
    activityPercent
  }
  screenshots {
    id
    sessionId
    intervalStartedAt
    capturedAt
    imageUrl
    displayId
    blurred
    activityPercent
  }
  sessions {
    id
    startedAt
    endedAt
    status
    projectId
    projectName
    activeMs
    idleMs
    keyCount
    mouseCount
  }
  appUsage {
    appName
    durationMs
  }
}

query TrackerAccessList {
  trackerAccessList {
    ...TrackerAccessFields
  }
}

query TrackerDevices($userId: ID) {
  trackerDevices(userId: $userId) {
    ...TrackerDeviceFields
  }
}

query TrackerSettings {
  trackerSettings {
    ...TrackerSettingsFields
  }
}

query TrackerCalendar($userId: ID!, $from: DateTime!, $to: DateTime!, $timezone: String!) {
  trackerCalendar(userId: $userId, from: $from, to: $to, timezone: $timezone) {
    ...TrackerDayBucketFields
  }
}

query TrackerDay($userId: ID!, $start: DateTime!, $end: DateTime!) {
  trackerDay(userId: $userId, start: $start, end: $end) {
    ...TrackerDayFields
  }
}

query MyTrackerAccess {
  myTrackerAccess {
    ...TrackerAccessFields
  }
}

query MyTrackerCalendar($from: DateTime!, $to: DateTime!, $timezone: String!) {
  myTrackerCalendar(from: $from, to: $to, timezone: $timezone) {
    ...TrackerDayBucketFields
  }
}

query MyTrackerDay($start: DateTime!, $end: DateTime!) {
  myTrackerDay(start: $start, end: $end) {
    ...TrackerDayFields
  }
}

mutation GrantTrackerAccess($userId: ID!) {
  grantTrackerAccess(userId: $userId) {
    ...TrackerAccessFields
  }
}

mutation RevokeTrackerAccess($userId: ID!) {
  revokeTrackerAccess(userId: $userId) {
    ...TrackerAccessFields
  }
}

mutation RevokeTrackerDevice($deviceId: String!) {
  revokeTrackerDevice(deviceId: $deviceId) {
    ...TrackerDeviceFields
  }
}

mutation UpdateTrackerSettings($input: TrackerSettingsInput!) {
  updateTrackerSettings(input: $input) {
    ...TrackerSettingsFields
  }
}

query TrackerLatestRelease {
  trackerLatestRelease {
    version
    tag
    name
    notes
    url
    publishedAt
    assets {
      name
      platform
      version
      sizeBytes
      downloadCount
      url
    }
  }
}

query TrackerBilling($from: DateTime!, $to: DateTime!) {
  trackerBilling(from: $from, to: $to) {
    from
    to
    totalHours
    totalAmount
    currency
    rows {
      id
      name
      email
      payType
      currency
      billingRate
      hours
      amount
      rated
    }
  }
}

query TrackerBillingByProject($from: DateTime!, $to: DateTime!, $projectId: ID) {
  trackerBillingByProject(from: $from, to: $to, projectId: $projectId) {
    projectId
    projectName
    clientId
    clientName
    currency
    hours
    amount
    budgetHours
    budgetAmount
    employees {
      employeeId
      employeeName
      hours
      rate
      amount
    }
  }
}

fragment TrackerManualEntryFields on TrackerManualEntry {
  id
  userId
  userName
  projectId
  projectName
  startedAt
  endedAt
  durationMs
  note
  status
  reviewedAt
  reviewNote
  createdAt
}

query TrackerPendingManualEntries {
  trackerPendingManualEntries {
    ...TrackerManualEntryFields
  }
}

query TrackerManualEntries($userId: ID!, $from: DateTime!, $to: DateTime!) {
  trackerManualEntries(userId: $userId, from: $from, to: $to) {
    ...TrackerManualEntryFields
  }
}

query MyTrackerManualEntries($from: DateTime!, $to: DateTime!) {
  myTrackerManualEntries(from: $from, to: $to) {
    ...TrackerManualEntryFields
  }
}

mutation ReviewTrackerManualEntry(
  $id: ID!
  $status: TrackerManualEntryStatus!
  $reviewNote: String
) {
  reviewTrackerManualEntry(id: $id, status: $status, reviewNote: $reviewNote) {
    ...TrackerManualEntryFields
  }
}

mutation CreateTrackerManualEntry($input: TrackerManualEntryInput!) {
  createTrackerManualEntry(input: $input) {
    ...TrackerManualEntryFields
  }
}

mutation WithdrawTrackerManualEntry($id: ID!) {
  withdrawTrackerManualEntry(id: $id)
}

query TrackerProjectOptions {
  trackerProjectOptions {
    id
    name
    key
  }
}

fragment ProjectTimeLogRowFields on ProjectTimeLogRow {
  id
  userId
  userName
  taskId
  taskKey
  taskTitle
  activeMs
  idleMs
  manualMs
  sessions
  screenshots
}

query ProjectTimeLog($projectId: ID!, $from: DateTime!, $to: DateTime!) {
  projectTimeLog(projectId: $projectId, from: $from, to: $to) {
    rows {
      ...ProjectTimeLogRowFields
    }
    totalActiveMs
    totalManualMs
    canViewScreenshots
  }
}

query ProjectTimeLogSessions(
  $projectId: ID!
  $from: DateTime!
  $to: DateTime!
  $userId: ID
  $taskId: ID
) {
  projectTimeLogSessions(
    projectId: $projectId
    from: $from
    to: $to
    userId: $userId
    taskId: $taskId
  ) {
    id
    userId
    userName
    taskKey
    taskTitle
    startedAt
    endedAt
    activeMs
    idleMs
    screenshotCount
  }
}

query ProjectTimeLogScreenshots($projectId: ID!, $sessionId: ID!) {
  projectTimeLogScreenshots(projectId: $projectId, sessionId: $sessionId) {
    id
    capturedAt
    imageUrl
    blurred
  }
}

query TrackerTaskOptions($projectId: ID!) {
  trackerTaskOptions(projectId: $projectId) {
    id
    key
    title
    assignedToMe
  }
}

fragment TrackerMessageFields on TrackerMessage {
  id
  userId
  kind
  direction
  title
  body
  authorName
  readAt
  createdAt
}

query TrackerMessageThreads {
  trackerMessageThreads {
    userId
    userName
    userEmail
    lastMessageAt
    lastMessageBody
    unread
  }
}

query TrackerMessageThread($userId: ID!) {
  trackerMessageThread(userId: $userId) {
    ...TrackerMessageFields
  }
}

mutation SendTrackerMessage($userId: ID!, $body: String!) {
  sendTrackerMessage(userId: $userId, body: $body) {
    ...TrackerMessageFields
  }
}

mutation MarkTrackerThreadRead($userId: ID!) {
  markTrackerThreadRead(userId: $userId)
}

mutation SendTrackerNotice($input: TrackerNoticeInput!) {
  sendTrackerNotice(input: $input)
}

# A month's contract: the hours each day was worth and why a day was off.
fragment TrackerExpectedFields on TrackerExpected {
  workHoursPerDay
  days {
    date
    expectedMs
    offReason
    offLabel
  }
}

query TrackerExpected($userId: ID!, $from: DateTime!, $to: DateTime!, $timezone: String!) {
  trackerExpected(userId: $userId, from: $from, to: $to, timezone: $timezone) {
    ...TrackerExpectedFields
  }
}

# The signed-in employee's own month against their contract (My Tracker's day marks).
query MyTrackerExpected($from: DateTime!, $to: DateTime!, $timezone: String!) {
  myTrackerExpected(from: $from, to: $to, timezone: $timezone) {
    ...TrackerExpectedFields
  }
}

query TrackerExpectedReport($userId: ID!, $from: DateTime!, $to: DateTime!, $timezone: String!) {
  trackerExpectedReport(userId: $userId, from: $from, to: $to, timezone: $timezone) {
    fileName
    mimeType
    contentBase64
  }
}

# HR/ADMIN: one employee's hours as a PDF — statuses, active, off-computer, idle, totals, earnings.
query TrackerHoursReportPdf($userId: ID!, $from: DateTime!, $to: DateTime!, $timezone: String!) {
  trackerHoursReportPdf(userId: $userId, from: $from, to: $to, timezone: $timezone) {
    fileName
    mimeType
    contentBase64
  }
}

# The caller's own hours as a PDF.
query MyTrackerHoursReportPdf($from: DateTime!, $to: DateTime!, $timezone: String!) {
  myTrackerHoursReportPdf(from: $from, to: $to, timezone: $timezone) {
    fileName
    mimeType
    contentBase64
  }
}

# HR/ADMIN: every location pin an employee's tracker took on one day, in time order.
query EmployeeLocations($employeeId: ID!, $date: String!) {
  employeeLocations(employeeId: $employeeId, date: $date) {
    id
    lat
    lng
    accuracyM
    source
    kind
    capturedAt
  }
}

# HR/ADMIN/manager: every location pin an employee's tracker took over a range of local days
# (at most 31), in time order.
query EmployeeLocationsBetween($employeeId: ID!, $from: String!, $to: String!) {
  employeeLocationsBetween(employeeId: $employeeId, from: $from, to: $to) {
    id
    lat
    lng
    accuracyM
    source
    kind
    capturedAt
  }
}

# HR/ADMIN: what an employee's tracked time over a range pays at their hourly rate.
query EmployeeEarnings($employeeId: ID!, $from: String!, $to: String!) {
  employeeEarnings(employeeId: $employeeId, from: $from, to: $to) {
    payType
    rate
    currency
    trackedMs
    amount
  }
}
