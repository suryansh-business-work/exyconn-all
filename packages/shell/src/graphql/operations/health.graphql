# Admin › System Health: the deployment's own vital signs.

query SystemHealth {
  systemHealth {
    serverVersion
    nodeVersion
    uptimeSeconds
    mongo {
      ok
      dbName
      collections
      dataSizeMb
    }
    jobs {
      key
      label
      enabled
      lastRunAt
      lastRunSummary
    }
    counts {
      label
      value
    }
    backup {
      configured
      ok
      lastRunAt
      archive
      sizeMb
      retainDays
      message
    }
  }
}
