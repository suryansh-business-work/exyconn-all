fragment CompanyFields on Company {
  id
  name
  domain
  industry
  size
  status
  phone
  location
  owner
  notes
}

fragment ContactFields on Contact {
  id
  name
  email
  phone
  title
  companyId
  companyName
  status
  owner
  notes
}

fragment DealFields on Deal {
  id
  title
  companyId
  companyName
  contactId
  contactName
  stage
  value
  probability
  expectedCloseDate
  owner
  notes
}

fragment ActivityFields on Activity {
  id
  type
  subject
  notes
  relatedType
  relatedId
  relatedName
  dueDate
  done
  owner
}

fragment CrmStats on TableStats {
  total
  counts {
    field
    buckets {
      value
      count
    }
  }
  sums {
    field
    total
  }
}

query ListCompanies {
  listCompanies {
    ...CompanyFields
  }
}

query ListCompaniesPaged($input: TableQueryInput!) {
  listCompaniesPaged(input: $input) {
    totalCount
    rows {
      ...CompanyFields
    }
  }
}

query ListCompaniesStats {
  listCompaniesStats {
    ...CrmStats
  }
}

mutation CreateCompany($input: CompanyInput!) {
  createCompany(input: $input) {
    id
  }
}

mutation UpdateCompany($id: ID!, $input: CompanyInput!) {
  updateCompany(id: $id, input: $input) {
    id
  }
}

mutation DeleteCompany($id: ID!) {
  deleteCompany(id: $id)
}

