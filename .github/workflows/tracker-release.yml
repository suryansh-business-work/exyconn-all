name: Tracker Release

# Builds the Exyconn Tracker for every platform — the desktop installers for Windows (.exe),
# macOS (.dmg) and Linux (.AppImage), and the phone app for Android (.apk + .aab) and iOS
# (.ipa) — publishes them on one GitHub Release tagged tracker-v<version>, and uploads the
# files to Slack. Runs when tracker code lands on main, and on demand from the portal's
# Tech > Tracker Build screen, which chooses the platforms and the Slack channels.
#
# Nothing is ever built on a developer's machine: this workflow is the only place a tracker
# binary comes from.
on:
  push:
    branches: [main]
    paths:
      - 'exyconn-tracker-app/**'
      - 'exyconn-tracker-mobile/**'
      - 'packages/tracker-core/**'
      - '.github/workflows/tracker-release.yml'
      - '.github/scripts/slack-upload-files.sh'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Builds to make, comma-separated: windows, macos, linux, android, ios'
        required: false
        default: 'windows,macos,linux,android,ios'
      slack_channels:
        description: 'Slack channel ids to post the installers to, comma-separated'
        required: false
        default: ''

concurrency:
  group: tracker-release
  cancel-in-progress: true

jobs:
  # A push builds everything; a dispatch builds only what was asked for. The matrix
  # is computed here rather than filtered per job, so a platform that was not chosen
  # never shows up as a skipped job in the run.
  plan:
    name: Plan builds
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      desktop: ${{ steps.pick.outputs.desktop }}
      android: ${{ steps.pick.outputs.android }}
      ios: ${{ steps.pick.outputs.ios }}
    steps:
      - id: pick
        env:
          PLATFORMS: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'windows,macos,linux,android,ios' }}
        run: |
          all='[
            {"os":"windows-latest","key":"windows","label":"Windows","script":"package:win","glob":"*.exe"},
            {"os":"macos-latest","key":"macos","label":"macOS","script":"package:mac","glob":"*.dmg"},
            {"os":"ubuntu-latest","key":"linux","label":"Linux","script":"package:linux","glob":"*.AppImage"}
          ]'
          keys=$(jq -c --arg want "$PLATFORMS" -n '$want | ascii_downcase | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(. != ""))')
          # `.key` has to be bound before the lookup: inside `index(...)` the input is
          # already the wanted-keys array, so a bare `.key` indexes that array and fails.
          chosen=$(jq -c --argjson keys "$keys" '[ .[] | select(.key as $k | $keys | index($k)) ]' <<<"$all")
          android=$(jq -r 'index("android") != null' <<<"$keys")
          ios=$(jq -r 'index("ios") != null' <<<"$keys")
          desktop=$(jq -r 'length > 0' <<<"$chosen")
          if [ "$desktop" = "false" ] && [ "$android" = "false" ] && [ "$ios" = "false" ]; then
            echo "::error::No known platform in \"$PLATFORMS\" — expected windows, macos, linux, android or ios."
            exit 1
          fi
          {
            echo "matrix=$chosen"
            echo "desktop=$desktop"
            echo "android=$android"
            echo "ios=$ios"
          } >> "$GITHUB_OUTPUT"
          echo "Building: $PLATFORMS"

  build:
    name: Build ${{ matrix.label }}
    needs: plan
    if: needs.plan.outputs.desktop == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      # No Apple Developer ID in CI yet — ship the DMG unsigned instead of failing the build.
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package ${{ matrix.label }} installer
        run: pnpm --filter exyconn-tracker-app run ${{ matrix.script }}
      - uses: actions/upload-artifact@v7
        with:
          name: tracker-${{ matrix.label }}
          path: |
            exyconn-tracker-app/dist/${{ matrix.glob }}
            exyconn-tracker-app/dist/*.zip
            exyconn-tracker-app/dist/*.blockmap
            exyconn-tracker-app/dist/latest*.yml
          if-no-files-found: error

  # The phone app (exyconn-tracker-mobile) shares its version with the desktop app, so one
  # release carries every platform. The Android build is signed with the upload keystore from
  # the repository secrets — and refuses to build without it rather than shipping a
  # debug-signed APK that no later build could install over.
  android:
    name: Build Android (APK + AAB)
    needs: plan
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Check the mobile version matches the tracker version
        run: node .github/scripts/check-tracker-versions.mjs
      - name: Decode the upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::The Android upload keystore is not configured. Add the repository secrets ANDROID_KEYSTORE_BASE64 (base64 of the .jks), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "EXYCONN_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Generate the native project
        working-directory: exyconn-tracker-mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean
      - name: Build the signed APK and AAB
        working-directory: exyconn-tracker-mobile/android
        env:
          EXYCONN_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EXYCONN_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EXYCONN_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Real devices only: arm64 for every current phone, armeabi-v7a for older ones.
        run: ./gradlew assembleRelease bundleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon
      - name: Name the files after the release
        run: |
          version=$(node -p "require('./exyconn-tracker-mobile/package.json').version")
          mkdir -p mobile-out
          cp exyconn-tracker-mobile/android/app/build/outputs/apk/release/app-release.apk "mobile-out/Exyconn-Tracker-$version.apk"
          cp exyconn-tracker-mobile/android/app/build/outputs/bundle/release/app-release.aab "mobile-out/Exyconn-Tracker-$version.aab"
      - uses: actions/upload-artifact@v7
        with:
          name: tracker-Android
          path: mobile-out/*
          if-no-files-found: error

  # No Apple Developer account is configured yet, so the IPA is built UNSIGNED: it installs only
  # after being re-signed (Sideloadly, AltStore, or an enterprise/ad-hoc profile). Signing slots
  # in here once a distribution certificate and provisioning profile exist.
  ios:
    name: Build iOS (unsigned IPA)
    needs: plan
    if: needs.plan.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: pnpm install --frozen-lockfile
      - name: Check the mobile version matches the tracker version
        run: node .github/scripts/check-tracker-versions.mjs
      - name: Generate the native project
        working-directory: exyconn-tracker-mobile
        run: pnpm exec expo prebuild --platform ios --no-install --clean
      - name: Install pods
        working-directory: exyconn-tracker-mobile/ios
        run: pod install
      - name: Archive without signing
        working-directory: exyconn-tracker-mobile/ios
        run: |
          workspace=$(ls -d *.xcworkspace | head -1)
          scheme="${workspace%.xcworkspace}"
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/tracker.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package the IPA
        run: |
          version=$(node -p "require('./exyconn-tracker-mobile/package.json').version")
          mkdir -p "$RUNNER_TEMP/ipa/Payload" mobile-out
          cp -R "$RUNNER_TEMP"/tracker.xcarchive/Products/Applications/*.app "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/mobile-out/Exyconn-Tracker-$version-unsigned.ipa" Payload)
      - uses: actions/upload-artifact@v7
        with:
          name: tracker-iOS
          path: mobile-out/*
          if-no-files-found: error

  release:
    name: Publish release & post to Slack
    needs: [plan, build, android, ios]
    # A platform that was not asked for is skipped, not failed — publish whatever was built,
    # but never a release missing a platform that was asked for and broke.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Read app version
        id: app
        run: echo "version=$(node -p "require('./exyconn-tracker-app/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          pattern: tracker-*
          merge-multiple: true
          path: installers
      - name: Create GitHub Release
        id: gh_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: tracker-v${{ steps.app.outputs.version }}
          name: Exyconn Tracker ${{ steps.app.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: installers/*
          make_latest: true
      # Posting to Slack needs a bot token (an incoming webhook cannot carry files).
      # A dispatch from the portal names its own channels; a push falls back to the
      # repository default. Until both are set the release itself still succeeds —
      # the installers are on the GitHub Release either way, so a missing
      # notification is a notice, not a failed release.
      - name: Check Slack credentials
        id: slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANNELS: ${{ inputs.slack_channels || secrets.SLACK_CHANNEL_ID }}
        run: |
          if [ -n "$SLACK_BOT_TOKEN" ] && [ -n "$CHANNELS" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping the Slack upload. The bot token is always a repository secret — CI cannot read the portal database — so set SLACK_BOT_TOKEN (scopes files:write, chat:write, channels:join). Channels come from Tech > Settings for a build started in the portal, and from SLACK_CHANNEL_ID for a push. The bot joins a public channel on its own; invite it to a private one."
          fi
      - name: Upload installers to Slack
        if: steps.slack.outputs.configured == 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_IDS: ${{ inputs.slack_channels || secrets.SLACK_CHANNEL_ID }}
          SLACK_MESSAGE: |
            :rocket: *Exyconn Tracker ${{ steps.app.outputs.version }}* is out — installers attached.
            Desktop: .exe (Windows) · .dmg (macOS) · .AppImage (Linux). Phone: .apk (Android install) · .aab (Play Store upload) · .ipa (iOS, unsigned — re-sign before installing).
            Release: ${{ steps.gh_release.outputs.url }}
        # Installers only — the manifests and blockmaps beside them on the release are for
        # the desktop app's updater to read, not for anybody to download out of Slack.
        run: |
          shopt -s nullglob
          .github/scripts/slack-upload-files.sh installers/*.exe installers/*.dmg installers/*.AppImage installers/*.apk installers/*.aab installers/*.ipa
