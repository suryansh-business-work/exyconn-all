name: Tracker Release

# Builds the Exyconn Tracker desktop installers for Windows (.exe), macOS (.dmg) and
# Linux (.AppImage), publishes them on a GitHub Release tagged tracker-v<version>, and
# uploads the three files to Slack. Runs when tracker code lands on main, or by hand.
on:
  push:
    branches: [main]
    paths:
      - 'exyconn-tracker-app/**'
      - '.github/workflows/tracker-release.yml'
      - '.github/scripts/slack-upload-files.sh'
  workflow_dispatch:

concurrency:
  group: tracker-release
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            script: package:win
            glob: '*.exe'
          - os: macos-latest
            label: macOS
            script: package:mac
            glob: '*.dmg'
          - os: ubuntu-latest
            label: Linux
            script: package:linux
            glob: '*.AppImage'
    env:
      # No Apple Developer ID in CI yet — ship the DMG unsigned instead of failing the build.
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package ${{ matrix.label }} installer
        run: pnpm --filter exyconn-tracker-app run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: tracker-${{ matrix.label }}
          path: exyconn-tracker-app/dist/${{ matrix.glob }}
          if-no-files-found: error

  release:
    name: Publish release & post to Slack
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read app version
        id: app
        run: echo "version=$(node -p "require('./exyconn-tracker-app/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: tracker-*
          merge-multiple: true
          path: installers
      - name: Create GitHub Release
        id: gh_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tracker-v${{ steps.app.outputs.version }}
          name: Exyconn Tracker ${{ steps.app.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: installers/*
          make_latest: true
      # Posting to Slack needs a bot token (an incoming webhook cannot carry files).
      # Until those secrets exist the release itself still succeeds — the installers
      # are on the GitHub Release either way, so a missing notification is a notice,
      # not a failed release.
      - name: Check Slack credentials
        id: slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          if [ -n "$SLACK_BOT_TOKEN" ] && [ -n "$SLACK_CHANNEL_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping the Slack upload — set SLACK_BOT_TOKEN (scopes files:write, chat:write) and SLACK_CHANNEL_ID, and invite the bot to the channel."
          fi
      - name: Upload installers to Slack
        if: steps.slack.outputs.configured == 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_MESSAGE: |
            :rocket: *Exyconn Tracker ${{ steps.app.outputs.version }}* is out — Windows, macOS and Linux installers attached.
            Release: ${{ steps.gh_release.outputs.url }}
        run: .github/scripts/slack-upload-files.sh installers/*
