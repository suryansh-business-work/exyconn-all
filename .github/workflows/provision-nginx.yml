name: Provision nginx & TLS

# Installs the nginx vhosts and obtains their certificates on the server.
#
# A new portal subdomain needs this once: the deploy workflow starts its container
# but only ever copies the compose file, so nginx has no vhost for the new host and
# the domain answers nothing until this runs. Kept manual because it rewrites nginx
# config and talks to Let's Encrypt, which has rate limits.
#
# deploy/server-setup.sh backs up the current config first, and is additive and
# idempotent — certbot skips any certificate that is still valid.
# It also installs the exyconn security-header and rate-limit snippets
# (deploy/nginx/snippets, deploy/nginx/http) and syncs their includes into the
# certbot-managed vhosts, rolling back if `nginx -t` fails.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "provision" to confirm rewriting nginx config and requesting certificates'
        required: true
        default: ''

concurrency:
  group: provision-nginx
  cancel-in-progress: false

# Least privilege for the GITHUB_TOKEN; a job that needs more asks for it itself.
permissions:
  contents: read

jobs:
  provision:
    name: Install vhosts & certificates
    runs-on: ubuntu-latest
    steps:
      - name: Check the confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "provision" ]; then
            echo '::error::Type "provision" in the confirm box to run this.'
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Copy the deploy directory to the server
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: deploy/
          target: /opt/exyconn-deploy
          strip_components: 1
      - name: Install vhosts and obtain certificates
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 20m
          script: |
            set -e
            bash /opt/exyconn-deploy/server-setup.sh
      - name: Health-check every domain
        run: |
          urls=(
            "https://portal.exyconn.com" "https://admin.exyconn.com" "https://employee.exyconn.com"
            "https://finance.exyconn.com" "https://support.exyconn.com" "https://crm.exyconn.com"
            "https://products.exyconn.com" "https://legal.exyconn.com" "https://hr.exyconn.com"
            "https://marketing.exyconn.com" "https://projects.exyconn.com" "https://ai.exyconn.com"
            "https://website.exyconn.com" "https://tracker.exyconn.com" "https://tech.exyconn.com"
            "https://it.exyconn.com" "https://compliance.exyconn.com" "https://social.exyconn.com"
            "https://status.exyconn.com"
          )
          fail=0
          for url in "${urls[@]}"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 --retry 3 --retry-delay 10 --retry-all-errors "$url" || echo 000)
            if [ "$code" = "200" ]; then
              echo "  $url -> $code"
            else
              echo "::error::$url -> $code"
              fail=1
            fi
          done
          exit $fail
