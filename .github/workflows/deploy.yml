name: Build & Deploy Exyconn

# Deploys the full stack to 148.135.136.107 on push to main (or manual run).
# All credentials come from GitHub Actions secrets — nothing is hardcoded.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time: two runs racing `compose down`/`up` on the same host can
# fight over container names and leave a half-swapped stack. Queue instead of
# cancelling — a cancelled deploy would abandon the server mid-rollout.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  OWNER: ${{ secrets.DOCKERHUB_USERNAME }}
  TAG: ${{ github.sha }}

jobs:
  test-tools:
    name: Test tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: exyconn-tools
        run: npm run install:all
      - name: Typecheck, lint & test (ui + server)
        working-directory: exyconn-tools
        run: |
          npm run typecheck
          npm run lint
          npm run test

  test-workspace:
    name: Test workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # CI skips main (it deploys instead), so this is the only gate on a push
      # straight to main — without it a type error is first seen by the image build.
      - name: GraphQL codegen is in sync
        run: |
          pnpm codegen
          git diff --exit-code -- exyconn-portal/server/src/graphql/generated packages/shell/src/graphql/generated \
            || { echo "::error::Committed GraphQL codegen output is stale — run 'pnpm codegen' and commit the result."; exit 1; }
      - run: pnpm --filter '@exyconn/*' --filter exyconn-portal-server --filter exyconn-portal-ui --filter exyconn-tracker-app --workspace-concurrency=2 run typecheck
      - run: pnpm --filter '@exyconn/*' --filter exyconn-portal-server --filter exyconn-portal-ui --filter exyconn-tracker-app --workspace-concurrency=3 run lint
      - run: pnpm --filter '@exyconn/*' --filter exyconn-portal-server --filter exyconn-portal-ui --filter exyconn-tracker-app --workspace-concurrency=1 run test

  build:
    name: Build & push ${{ matrix.service }}
    needs: [test-tools, test-workspace]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: website
            dockerfile: docker/website.Dockerfile
            context: .
            build_args: ''
          - service: portal-hub
            dockerfile: docker/portal-app.Dockerfile
            context: .
            build_args: |
              APP_PKG=exyconn-portal-ui
              APP_DIR=exyconn-portal/ui
              PORT=4003
              VITE_PORTAL_APP=hub
          - service: portal-admin
            dockerfile: docker/portal-app.Dockerfile
            context: .
            build_args: |
              APP_PKG=@exyconn/portal-app-admin
              APP_DIR=exyconn-portal/apps/admin
              PORT=4020
              VITE_PORTAL_APP=admin
          - service: portal-employee
            dockerfile: docker/portal-app.Dockerfile
            context: .
            build_args: |
              APP_PKG=@exyconn/portal-app-employee
              APP_DIR=exyconn-portal/apps/employee
              PORT=4021
              VITE_PORTAL_APP=employee
          - service: portal-finance
            dockerfile: docker/portal-app.Dockerfile
            context: .
            build_args: |
              APP_PKG=@exyconn/portal-app-finance
              APP_DIR=exyconn-portal/apps/finance
              PORT=4022
              VITE_PORTAL_APP=finance
          - service: portal-support
            dockerfile: docker/portal-app.Dockerfile
            context: .
            build_args: |
              APP_PKG=@exyconn/portal-app-support
              APP_DIR=exyconn-portal/apps/support
              PORT=4023
              VITE_PORTAL_APP=support
          - service: portal-crm
            dockerfile: docker/portal-app.Dockerfile
            context: .
            build_args: |
              APP_PKG=@exyconn/portal-app-crm
              APP_DIR=exyconn-portal/apps/crm
              PORT=4024
              VITE_PORTAL_APP=crm
          - service: portal-products
            dockerfile: docker/portal-app.Dockerfile
            context: .
            build_args: |
              APP_PKG=@exyconn/portal-app-products
              APP_DIR=exyconn-portal/apps/products
              PORT=4025
              VITE_PORTAL_APP=products
          - service: portal-legal
            dockerfile: docker/portal-app.Dockerfile
            context: .
            build_args: |
              APP_PKG=@exyconn/portal-app-legal
              APP_DIR=exyconn-portal/apps/legal
              PORT=4026
              VITE_PORTAL_APP=legal
          - service: portal-hr
            dockerfile: docker/portal-app.Dockerfile
            context: .
            build_args: |
              APP_PKG=@exyconn/portal-app-hr
              APP_DIR=exyconn-portal/apps/hr
              PORT=4027
              VITE_PORTAL_APP=hr
          - service: portal-marketing
            dockerfile: docker/portal-app.Dockerfile
            context: .
            build_args: |
              APP_PKG=@exyconn/portal-app-marketing
              APP_DIR=exyconn-portal/apps/marketing
              PORT=4028
              VITE_PORTAL_APP=marketing
          - service: portal-projects
            dockerfile: docker/portal-app.Dockerfile
            context: .
            build_args: |
              APP_PKG=@exyconn/portal-app-projects
              APP_DIR=exyconn-portal/apps/projects
              PORT=4029
              VITE_PORTAL_APP=projects
          - service: portal-ai
            dockerfile: docker/portal-app.Dockerfile
            context: .
            build_args: |
              APP_PKG=@exyconn/portal-app-ai
              APP_DIR=exyconn-portal/apps/ai
              PORT=4030
              VITE_PORTAL_APP=ai
          - service: portal-tech
            dockerfile: docker/portal-app.Dockerfile
            context: .
            build_args: |
              APP_PKG=@exyconn/portal-app-tech
              APP_DIR=exyconn-portal/apps/tech
              PORT=4033
              VITE_PORTAL_APP=tech
          - service: portal-website
            dockerfile: docker/portal-app.Dockerfile
            context: .
            build_args: |
              APP_PKG=@exyconn/portal-app-website
              APP_DIR=exyconn-portal/apps/website
              PORT=4031
              VITE_PORTAL_APP=website
          - service: portal-tracker
            dockerfile: docker/portal-app.Dockerfile
            context: .
            build_args: |
              APP_PKG=@exyconn/portal-app-tracker
              APP_DIR=exyconn-portal/apps/tracker
              PORT=4032
              VITE_PORTAL_APP=tracker
          - service: portal-server
            dockerfile: docker/portal-server.Dockerfile
            context: .
            build_args: ''
          - service: tools-ui
            dockerfile: exyconn-tools/ui/Dockerfile
            context: exyconn-tools/ui
            build_args: VITE_API_BASE_URL=https://tools-api.exyconn.com
          - service: tools-api
            dockerfile: exyconn-tools/server/Dockerfile
            context: exyconn-tools/server
            build_args: ''
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/exyconn-${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/exyconn-${{ matrix.service }}:${{ github.sha }}
          # Scope the layer cache per service: the matrix builds 18 images, and an
          # unscoped gha cache is one shared key they would all overwrite each other in.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: docker-compose.prod.yml
          target: /opt/exyconn
      - name: Pull images & restart stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: TAG
          script: |
            set -e
            cd /opt/exyconn
            cat > .env <<EOF
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            TAG=${{ github.sha }}
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            GOOGLE_MAP_API=${{ secrets.GOOGLE_MAP_API }}
            TINA_GITHUB_TOKEN=${{ secrets.TINA_GITHUB_TOKEN }}
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            EOF
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            # Remove every existing exyconn container (this stack + any from older pipelines)
            # so only the freshly-pulled containers run, with no name conflicts.
            docker compose -f docker-compose.prod.yml down --remove-orphans || true
            docker ps -aq --filter "name=exyconn-" | xargs -r docker rm -f || true
            # --wait blocks until every service reports healthy, so the verify job never
            # races portal-server's boot (Mongo connect + admin bootstrap take a few seconds).
            docker compose -f docker-compose.prod.yml up -d --remove-orphans --wait --wait-timeout 180
            docker image prune -f

  verify:
    name: Verify 200 OK
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the API to come up
        run: |
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://portal-server.exyconn.com/health || echo 000)
            [ "$code" = "200" ] && { echo "API healthy after $((i*5))s"; exit 0; }
            sleep 5
          done
          echo "::error::portal-server did not become healthy within 120s"; exit 1
      - name: Health-check every domain
        run: |
          urls=(
            "https://exyconn.com"
            "https://tools.exyconn.com"
            "https://tools-api.exyconn.com/health"
            "https://portal-server.exyconn.com/health"
            "https://portal.exyconn.com"
            "https://admin.exyconn.com"
            "https://employee.exyconn.com"
            "https://finance.exyconn.com"
            "https://support.exyconn.com"
            "https://crm.exyconn.com"
            "https://products.exyconn.com"
            "https://legal.exyconn.com"
            "https://tech.exyconn.com"
            "https://hr.exyconn.com"
            "https://marketing.exyconn.com"
            "https://projects.exyconn.com"
            "https://ai.exyconn.com"
            "https://website.exyconn.com"
            "https://tracker.exyconn.com"
          )
          fail=0
          # Report every domain (a curl connect/DNS/TLS error shows as 000) before failing,
          # so a missing subdomain vhost/cert is obvious instead of aborting on the first.
          for url in "${urls[@]}"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 --retry 3 --retry-delay 10 --retry-all-errors "$url" || echo 000)
            if [ "$code" = "200" ]; then
              echo "OK   $url -> $code"
            else
              echo "DOWN $url -> $code"
              fail=1
            fi
          done
          if [ "$fail" != "0" ]; then
            echo "::error::One or more services are not reachable over HTTPS. If a domain shows 000, its DNS A record and/or nginx vhost + certbot cert is not set up yet (run deploy/server-setup.sh)."
            exit 1
          fi
          echo "Every service returned 200 OK."

  tracker:
    name: Build tracker installer (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package Windows installer
        run: pnpm --filter exyconn-tracker-app run package:win
      - uses: actions/upload-artifact@v4
        with:
          name: exyconn-tracker-windows
          path: exyconn-tracker-app/dist/*.exe
          if-no-files-found: error

  notify:
    name: Notify Slack
    needs: [verify, tracker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Post result to Slack
        run: |
          status="${{ (needs.verify.result == 'success' && needs.tracker.result == 'success') && '✅ succeeded' || '❌ failed' }}"
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"Exyconn deploy $status for commit ${{ github.sha }} on ${{ github.ref_name }}\"}" \
            "${{ secrets.SLACK_WEBHOOK }}"
