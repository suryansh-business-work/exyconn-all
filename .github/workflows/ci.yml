name: CI

# Typecheck, lint and test the workspace on every PR and push (except main, which deploys).
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  workspace:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter exyconn-portal-server --filter exyconn-portal-ui --filter exyconn-tracker-app --parallel run typecheck
      - run: pnpm --filter exyconn-portal-server --filter exyconn-portal-ui --filter exyconn-tracker-app --parallel run lint
      - run: pnpm --filter exyconn-portal-server --filter exyconn-portal-ui --filter exyconn-tracker-app --parallel run test

  tools-ui:
    name: Tools UI · Typecheck · Lint · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: exyconn-tools
        run: npm run install:all
      - name: Typecheck
        working-directory: exyconn-tools/ui
        run: npm run typecheck
      - name: Lint
        working-directory: exyconn-tools/ui
        run: npm run lint
      - name: Test
        working-directory: exyconn-tools/ui
        run: npm test

  tools-server:
    name: Tools Server · Typecheck · Lint · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: exyconn-tools
        run: npm run install:all
      - name: Typecheck
        working-directory: exyconn-tools/server
        run: npm run typecheck
      - name: Lint
        working-directory: exyconn-tools/server
        run: npm run lint
      - name: Test
        working-directory: exyconn-tools/server
        run: npm test
