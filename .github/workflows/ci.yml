name: CI

# Typecheck, lint and test the workspace on every PR and push (except main, which deploys).
on:
  pull_request:
  push:
    branches-ignore: [main]

# One run per branch at a time: a new push cancels the still-running one for the same
# branch, and a push + pull_request pair for the same commit collapses to one run.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Least privilege for the GITHUB_TOKEN; a job that needs more asks for it itself.
permissions:
  contents: read

jobs:
  # What this change can break: the workspace packages it touched and everything depending on
  # them, measured against main (see .github/scripts/ci-scope.mjs). Every job below runs only
  # when its part of the repository is in scope; a docs-only change runs nothing else.
  scope:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      filter: ${{ steps.scope.outputs.filter }}
      test-filter: ${{ steps.scope.outputs.test-filter }}
      checks: ${{ steps.scope.outputs.checks }}
      server: ${{ steps.scope.outputs.server }}
      codegen: ${{ steps.scope.outputs.codegen }}
      mobile: ${{ steps.scope.outputs.mobile }}
      ct-groups: ${{ steps.scope.outputs.ct-groups }}
      e2e: ${{ steps.scope.outputs.e2e }}
      website: ${{ steps.scope.outputs.website }}
      tools: ${{ steps.scope.outputs.tools }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: scope
        run: node .github/scripts/ci-scope.mjs

  workspace:
    needs: scope
    name: Workspace
    uses: ./.github/workflows/workspace-checks.yml
    with:
      filter: ${{ needs.scope.outputs.filter }}
      test-filter: ${{ needs.scope.outputs.test-filter }}
      checks: ${{ needs.scope.outputs.checks == 'true' }}
      server: ${{ needs.scope.outputs.server == 'true' }}
      codegen: ${{ needs.scope.outputs.codegen == 'true' }}
      mobile: ${{ needs.scope.outputs.mobile == 'true' }}
      coverage: true

  # Every form ships a .form.cy.tsx (CLAUDE.md rule 10). The packages in scope are split into
  # groups of about the same number of specs, one runner each.
  component-tests:
    needs: scope
    if: needs.scope.outputs.ct-groups != '[]'
    name: Component tests · group ${{ matrix.group.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.scope.outputs.ct-groups) }}
    env:
      FILTER: ${{ matrix.group.filter }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # The Electron binary is ~700MB and is not in the pnpm store, so it is cached
      # separately from node_modules or every run re-downloads it.
      - name: Cache Cypress binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: cypress-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # A cache hit skips the postinstall download, so install explicitly — a no-op when the
      # binary is already cached. Verify catches ELECTRON_RUN_AS_NODE turning it into plain node.
      - name: Install and verify Cypress
        run: |
          pnpm --filter @exyconn/ui exec cypress install
          pnpm --filter @exyconn/ui exec cypress verify
      - name: Component suites
        run: pnpm $FILTER --no-bail --workspace-concurrency=1 run test:ct
      # Collected with find (pruning node_modules) rather than a ** glob in upload-artifact,
      # which walked every node_modules tree and spent twenty minutes doing it.
      - name: Collect accessibility results and screenshots
        if: always()
        run: |
          mkdir -p ci-a11y ci-screenshots
          find . -path '*/node_modules' -prune -o -path './ci-*' -prune \
            -o -path '*/cypress/a11y/report.jsonl' -print | xargs -r -I{} cp --parents {} ci-a11y/
          find . -path '*/node_modules' -prune -o -path './ci-*' -prune \
            -o -type d -path '*/cypress/screenshots' -print | xargs -r -I{} cp -r --parents {} ci-screenshots/
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a11y-results-${{ matrix.group.id }}
          path: ci-a11y/
          if-no-files-found: ignore
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cypress-screenshots-${{ matrix.group.id }}
          path: ci-screenshots/
          if-no-files-found: ignore
          retention-days: 7

  # The one spec that renders whole pages — sign-in, and the portal layout after it — so axe
  # checks page structure too (skip link, landmarks, headings, language). Its GraphQL is
  # mocked; it needs a build of the hub, not a server.
  e2e:
    needs: scope
    if: needs.scope.outputs.e2e == 'true'
    name: Portal pages end to end (WCAG 2.2 AA)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # The Electron binary is ~700MB and is not in the pnpm store, so it is cached
      # separately from node_modules or every run re-downloads it.
      - name: Cache Cypress binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: cypress-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # A cache hit skips the postinstall download, so install explicitly — a no-op when the
      # binary is already cached. Verify catches ELECTRON_RUN_AS_NODE turning it into plain node.
      - name: Install and verify Cypress
        run: |
          pnpm --filter @exyconn/ui exec cypress install
          pnpm --filter @exyconn/ui exec cypress verify
      - name: Portal pages end to end
        run: |
          pnpm --filter exyconn-portal-ui build
          pnpm --filter exyconn-portal-ui test:e2e
      # Collected with find (pruning node_modules) rather than a ** glob in upload-artifact,
      # which walked every node_modules tree and spent twenty minutes doing it.
      - name: Collect accessibility results and screenshots
        if: always()
        run: |
          mkdir -p ci-a11y ci-screenshots
          find . -path '*/node_modules' -prune -o -path './ci-*' -prune \
            -o -path '*/cypress/a11y/report.jsonl' -print | xargs -r -I{} cp --parents {} ci-a11y/
          find . -path '*/node_modules' -prune -o -path './ci-*' -prune \
            -o -type d -path '*/cypress/screenshots' -print | xargs -r -I{} cp -r --parents {} ci-screenshots/
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a11y-results-e2e
          path: ci-a11y/
          if-no-files-found: ignore
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cypress-screenshots-e2e
          path: ci-screenshots/
          if-no-files-found: ignore
          retention-days: 7

  # One comment on the pull request — accessibility, coverage and duplication — kept up to date on
  # every push, and the same report in the run's summary. It runs even when a job above failed:
  # that is when the report matters most.
  quality-report:
    timeout-minutes: 15
    name: Quality report (a11y · coverage · duplication)
    needs: [workspace, component-tests, e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # A job that was out of scope uploaded nothing, so a pattern may match no artifact.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          pattern: '{coverage-unit,a11y-results-*}'
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          pattern: server-coverage-*
          path: ci-coverage
          merge-multiple: true
      # The server suite runs in four shards; their raw coverage is merged into one summary.
      - name: Merge server coverage
        run: |
          if ls ci-coverage/*.json > /dev/null 2>&1; then
            npx --yes nyc@17.1.0 report --temp-dir ci-coverage --reporter=json-summary \
              --report-dir exyconn-portal/server/coverage
          fi
      - name: Accessibility section
        run: node .github/scripts/pr-reports/a11y.mjs
      - name: Coverage section
        run: node .github/scripts/pr-reports/coverage.mjs
      - name: Duplication section
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          npx --yes jscpd@4.0.5
          # Files this PR (or push) changed; a new branch's first push has no "before" to diff.
          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE_SHA" HEAD > reports/changed-files.txt
          else
            git diff --name-only HEAD~1 HEAD > reports/changed-files.txt
          fi
          CHANGED_FILES="$(cat reports/changed-files.txt)" node .github/scripts/pr-reports/duplication.mjs
      - name: Post the report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/pr-reports/post.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-report
          path: reports/
          retention-days: 14

  website:
    needs: scope
    if: needs.scope.outputs.website == 'true'
    timeout-minutes: 20
    name: Website · Typecheck · Lint · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The Astro site is a workspace package but was in no CI job, so nothing checked
      # it on a push. That was survivable while it read its own markdown; now it renders
      # blog posts and case studies out of the portal's public API, so a field renamed in
      # the portal breaks the marketing site and no other job would say so.
      - name: Typecheck
        working-directory: exyconn-website
        run: pnpm run typecheck
      - name: Lint
        working-directory: exyconn-website
        run: pnpm run lint
      - name: Test
        working-directory: exyconn-website
        run: pnpm test

  tools:
    needs: scope
    if: needs.scope.outputs.tools == 'true'
    name: Tools · Typecheck · Lint · Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install
        working-directory: exyconn-tools
        # onnxruntime-node (via @imgly/background-removal-node) otherwise downloads a CUDA
        # bundle from the ONNX Runtime GitHub release on linux/x64, which fails mid-download
        # often enough to redden a run. The runner has no NVIDIA GPU, so the CUDA provider
        # could never be used; the package's bundled CPU build is what actually runs.
        env:
          npm_config_onnxruntime_node_install_cuda: skip
        run: npm run install:all
      # ui and server in one job: they share the install above, which was the slow part of
      # the two jobs this replaces.
      - name: Typecheck
        working-directory: exyconn-tools
        run: npm run typecheck
      - name: Lint
        working-directory: exyconn-tools
        run: npm run lint
      - name: Test
        working-directory: exyconn-tools
        run: npm test
