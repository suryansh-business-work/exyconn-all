name: Close the MQTT ports

# Takes the MQTT broker off the public internet.
#
# 1883 (plaintext) and 8883 (TLS, cert CN=iot.exyconn.com) listen on the shared
# host, so they answered on every exyconn domain. The broker requires credentials,
# but 1883 sends them in clear text — see deploy/close-mqtt-ports.sh.
#
# Kept manual, and gated on a typed confirmation, because physical devices that
# reach the broker from outside lose their connection the moment this runs. The
# Infinity Home web app is unaffected: it talks to its own /api/mqtt and /ws on 443.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "close-mqtt" to confirm cutting off external MQTT devices'
        required: true
        default: ''

concurrency:
  group: close-mqtt-ports
  cancel-in-progress: false

jobs:
  close:
    name: Remove the public MQTT surface
    runs-on: ubuntu-latest
    steps:
      - name: Check the confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "close-mqtt" ]; then
            echo '::error::Type "close-mqtt" in the confirm box to run this.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Copy the deploy directory to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: deploy/
          target: /opt/exyconn-deploy
          strip_components: 1
      - name: Close 1883 and 8883
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 5m
          script: |
            set -e
            bash /opt/exyconn-deploy/close-mqtt-ports.sh
      - name: Verify the ports no longer answer from outside
        run: |
          fail=0
          for port in 1883 8883; do
            if timeout 8 bash -c "echo > /dev/tcp/iot.exyconn.com/${port}" 2>/dev/null; then
              echo "::error::iot.exyconn.com:${port} still accepts connections"
              fail=1
            else
              echo "  iot.exyconn.com:${port} unreachable"
            fi
          done
          exit $fail
      - name: Verify the web surface still serves
        run: |
          fail=0
          for url in "https://iot.exyconn.com" "https://portal.exyconn.com" "https://exyconn.com"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 --retry 3 --retry-delay 5 --retry-all-errors "$url" || echo 000)
            if [ "$code" = "200" ]; then
              echo "  $url -> $code"
            else
              echo "::error::$url -> $code"
              fail=1
            fi
          done
          exit $fail
