name: Workspace checks

# The pnpm workspace's static gates, typecheck, lint and unit tests, as parallel jobs. Called by
# ci.yml (scoped to what a change touched, see .github/scripts/ci-scope.mjs) and by deploy.yml
# (everything), so the two can never check different things.
on:
  workflow_call:
    inputs:
      filter:
        description: pnpm --filter arguments for typecheck and lint ('' skips them)
        type: string
        required: true
      test-filter:
        description: pnpm --filter arguments for the vitest packages ('' skips them)
        type: string
        required: true
      checks:
        type: boolean
        required: true
      server:
        description: Run the server's jest suite (in shards) and build what it needs
        type: boolean
        required: true
      codegen:
        type: boolean
        required: true
      mobile:
        type: boolean
        required: true
      coverage:
        description: Collect coverage for the PR quality report
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    if: inputs.checks
    name: Static checks · Typecheck · Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FILTER: ${{ inputs.filter }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The server resolves @exyconn/wa-flow through its compiled dist (types included), and
      # dist is never committed, so it is built before anything typechecks the server.
      - name: Build @exyconn/wa-flow and @exyconn/cms
        if: inputs.server
        run: pnpm --filter @exyconn/wa-flow --filter @exyconn/cms build
      # A workspace package the portal image does not copy the manifest for builds an image with
      # nothing installed, and dies on "tsc: not found" twenty minutes into a deploy.
      - name: Docker images copy every workspace package they build from
        run: node scripts/check-docker-manifests.mjs
      # An app importing a workspace package outside its install closure resolves here (CI
      # installs everything) and dies inside the deploy image, which installs one closure.
      - name: Workspace imports are installable
        run: node scripts/check-workspace-imports.mjs
      # A bad typeDefs block is a runtime parse error, so tsc passes and every server test then
      # fails with the same message. Name the file instead.
      - name: GraphQL SDL parses
        if: inputs.server
        run: node scripts/check-graphql-sdl.cjs
      # The codegen output is committed and no build regenerates it, so an operation added
      # without re-running codegen only surfaces later as a type error in an image build.
      - name: GraphQL codegen is in sync
        if: inputs.codegen
        run: |
          pnpm codegen
          git diff --exit-code -- exyconn-portal/server/src/graphql/generated packages/shell/src/graphql/generated packages/tracker-core/src/graphql/generated \
            || { echo "::error::Committed GraphQL codegen output is stale — run 'pnpm codegen' and commit the result."; exit 1; }
      # The phone app only builds in tracker-release.yml; evaluating its Expo config here
      # catches a broken config plugin in seconds.
      - name: Mobile app config evaluates
        if: inputs.mobile
        working-directory: exyconn-tracker-mobile
        run: pnpm exec expo config --type prebuild > /dev/null
      - name: Tracker versions agree
        run: node .github/scripts/check-tracker-versions.mjs
      # Two at a time: --parallel typecheck was OOM-killed on the runner.
      - name: Typecheck
        if: inputs.filter != ''
        run: pnpm $FILTER --workspace-concurrency=2 run typecheck
      - name: Lint
        if: inputs.filter != ''
        run: pnpm $FILTER --workspace-concurrency=3 run lint

  unit-tests:
    if: inputs.test-filter != ''
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FILTER: ${{ inputs.test-filter }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        if: ${{ !inputs.coverage }}
        run: pnpm $FILTER --workspace-concurrency=1 run test
      # Coverage is reported on the PR, not gated.
      - name: Unit tests (with coverage)
        if: inputs.coverage
        run: |
          pnpm $FILTER --workspace-concurrency=1 run test \
            --coverage.enabled --coverage.reporter=json-summary --coverage.reporter=text-summary \
            '--coverage.include=src/**/*.{ts,tsx}' '--coverage.exclude=**/*.{test,cy}.{ts,tsx}' '--coverage.exclude=**/graphql/generated/**'
      # Collected with find (pruning node_modules) rather than a ** glob in upload-artifact,
      # which walked every node_modules tree and spent twenty minutes doing it.
      - name: Collect coverage summaries
        if: always() && inputs.coverage
        run: |
          mkdir -p ci-artifacts
          find . -path '*/node_modules' -prune -o -path ./ci-artifacts -prune \
            -o -path '*/coverage/coverage-summary.json' -print | xargs -r -I{} cp --parents {} ci-artifacts/
      - if: always() && inputs.coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-unit
          path: ci-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  server-tests:
    if: inputs.server
    name: Server tests · shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Kept out of node_modules so the cache below can hold it between runs.
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Cache the MongoDB test binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/mongodb-binaries
          key: mongoms-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: mongoms-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Build @exyconn/wa-flow and @exyconn/cms
        run: pnpm --filter @exyconn/wa-flow --filter @exyconn/cms build
      # A quarter of the suites per job, two workers each: the suite was the slowest step of CI.
      - name: Server tests
        if: ${{ !inputs.coverage }}
        run: pnpm --filter exyconn-portal-server run test --shard=${{ matrix.shard }}/4 --maxWorkers=2
      - name: Server tests (with coverage)
        if: inputs.coverage
        run: |
          pnpm --filter exyconn-portal-server run test --shard=${{ matrix.shard }}/4 --maxWorkers=2 \
            --coverage --coverageReporters=json --coverageReporters=text-summary \
            '--collectCoverageFrom=src/**/*.ts' '--collectCoverageFrom=!src/graphql/generated/**'
      # Each shard's raw coverage; the quality report merges the four into one summary.
      - name: Collect coverage
        if: always() && inputs.coverage
        run: |
          mkdir -p ci-coverage
          if [ -f exyconn-portal/server/coverage/coverage-final.json ]; then
            cp exyconn-portal/server/coverage/coverage-final.json ci-coverage/server-${{ matrix.shard }}.json
          fi
      - if: always() && inputs.coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-coverage-${{ matrix.shard }}
          path: ci-coverage/
          if-no-files-found: ignore
          retention-days: 7
