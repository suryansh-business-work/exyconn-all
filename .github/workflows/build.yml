name: Build

# SonarQube analysis of the whole monorepo (sonar-project.properties at the root).
# Needs the SONAR_TOKEN and SONAR_HOST_URL repository secrets.
on:
  push:
    branches: [main, staging]
  workflow_dispatch:

# A burst of pushes to staging queued a full-monorepo scan for each; only the newest commit's
# analysis is worth having.
concurrency:
  group: sonar-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      # To fail the job when the Quality Gate is red, uncomment:
      # - uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
      #   timeout-minutes: 5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
