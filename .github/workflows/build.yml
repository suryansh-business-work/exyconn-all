name: Build

# SonarQube analysis of the whole monorepo (sonar-project.properties at the root). The unit suites
# run first, with coverage, because SonarQube reports 0% coverage for code it was never handed a
# report for. Every package is measured (CI_SCOPE_ALL), not just what the last push touched.
# Needs the SONAR_TOKEN and SONAR_HOST_URL repository secrets.
on:
  push:
    branches: [main, staging]
    # A docs-only push changes no code, no coverage and no issues.
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

# A burst of pushes to staging queued a full-monorepo scan for each; only the newest commit's
# analysis is worth having.
concurrency:
  group: sonar-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      test-filter: ${{ steps.scope.outputs.test-filter }}
      unit-groups: ${{ steps.scope.outputs.unit-groups }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: scope
        env:
          CI_SCOPE_ALL: "true"
        run: node .github/scripts/ci-scope.mjs

  # The workspace packages, the trackers and the portal server (four shards), exactly as CI runs
  # them, with lcov / raw coverage uploaded as artifacts.
  tests:
    needs: scope
    name: Unit tests
    uses: ./.github/workflows/workspace-checks.yml
    with:
      filter: ""
      test-filter: ${{ needs.scope.outputs.test-filter }}
      unit-groups: ${{ needs.scope.outputs.unit-groups }}
      checks: false
      server: true
      codegen: false
      mobile: false
      coverage: true

  website-tests:
    name: Website unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test with coverage
        working-directory: exyconn-website
        run: pnpm exec vitest run --coverage.enabled --coverage.reporter=lcov
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sonar-lcov-website
          path: exyconn-website/coverage/lcov.info
          retention-days: 7

  tools-tests:
    name: Tools unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install
        working-directory: exyconn-tools
        # See deploy.yml: the CUDA bundle download is skipped, the runner has no GPU.
        env:
          npm_config_onnxruntime_node_install_cuda: skip
        run: npm run install:all
      - name: Test ui with coverage
        working-directory: exyconn-tools/ui
        # Coverage-only, so it is installed here (same version as vitest) rather than added to
        # the project's lockfile.
        run: |
          npm install --no-save @vitest/coverage-v8@3.2.7
          npx vitest run --coverage.enabled --coverage.reporter=lcov
      - name: Test server with coverage
        working-directory: exyconn-tools/server
        # Coverage-only, so it is installed here (same version as vitest) rather than added to
        # the project's lockfile.
        run: |
          npm install --no-save @vitest/coverage-v8@3.2.7
          npx vitest run --coverage.enabled --coverage.reporter=lcov
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sonar-lcov-tools
          path: |
            exyconn-tools/ui/coverage/lcov.info
            exyconn-tools/server/coverage/lcov.info
          retention-days: 7

  sonar:
    name: Build and analyze
    needs: [tests, website-tests, tools-tests]
    # Analyse even when a test failed: a red suite must not hide the issues, and the coverage of
    # the suites that did run is still worth reporting.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Type-aware analysis of ~630k lines across ~40 tsconfigs: well over the 25 minutes it took
    # before it was cancelled.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # SonarQube reads each package's tsconfig.json, and those extend @exyconn/config. Without
      # node_modules it cannot find them and falls back to a non-strict compiler, which reports
      # casts that strict mode needs as "unnecessary" (S4325) and misses real type information.
      - run: pnpm install --frozen-lockfile
      # Workspace summaries and lcov keep their paths relative to the repository root.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          pattern: "{coverage-unit-*,sonar-lcov-*}"
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          pattern: server-coverage-*
          path: ci-coverage
          merge-multiple: true
      # The server suite runs in four shards; their raw coverage is merged into one lcov report.
      - name: Merge server coverage
        run: |
          if ls ci-coverage/*.json > /dev/null 2>&1; then
            npx --yes nyc@17.1.0 report --temp-dir ci-coverage --reporter=lcov \
              --report-dir exyconn-portal/server/coverage
          fi
      - name: Prepare coverage for SonarQube
        run: node .github/scripts/sonar-lcov.mjs .
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      # To fail the job when the Quality Gate is red, uncomment:
      # - uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
      #   timeout-minutes: 5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
