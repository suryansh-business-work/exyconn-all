name: Meeting Assistant Extension Release

# Builds the Exyconn Meeting Assistant Chrome extension, validates its manifest and bundle,
# packages a deterministic ZIP (+ SHA-256) for internal installs and one for the Chrome Web
# Store, keeps both as a run artifact, and uploads the internal ZIP to the portal server
# (POST /meet-assistant/releases/upload). The upload is authenticated with this run's GitHub
# Actions OIDC token, not a secret: the server checks GitHub's signature, the audience, the
# repository (set in AI › Meeting Assistant › Releases › Release settings), this workflow file
# and refs/heads/main. The build then waits as QA_PENDING on the Releases page; nobody is
# offered it until a release manager approves it, and users download it from the portal.
#
# It runs once "Build & Deploy Exyconn" has finished successfully on main, not on the push
# itself: the upload goes to the portal server that deploy has just rolled out, so a merge that
# adds or changes the upload endpoint never uploads to the old server (a 404 on 21 Oct 2026).
#
# Every deploy of main builds a new version: the build version is package.json's version plus
# this workflow's run number as Chrome's fourth part (1.0.0 -> 1.0.0.57), so no manual bump is
# needed. The portal stores a version once: re-uploading the same bytes (a re-run) is a no-op,
# different bytes for a stored version are refused. The portal's "Build new release" button
# dispatches this workflow with a channel. Nothing is published as a GitHub Release, so the
# desktop tracker's updater (which reads the repository's latest release) is never affected.
#
# The Chrome Web Store steps run only on a manual dispatch that asks for them, and only when
# the store credentials are configured; submitting for review is a separate, explicit choice.
on:
  workflow_run:
    workflows: ['Build & Deploy Exyconn']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel the portal registers the build on'
        type: choice
        options: [INTERNAL, BETA, STABLE]
        default: INTERNAL
      store_upload:
        description: 'Upload the store package to the Chrome Web Store (needs CWS_* secrets)'
        type: boolean
        default: false
      store_submit:
        description: 'Also submit it for Chrome Web Store review (only with store_upload)'
        type: boolean
        default: false

# One build at a time; each run has its own run number, so two runs never share a version.
concurrency:
  group: meet-extension-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build, verify and release
    # Only after a deploy that succeeded; a manual dispatch runs straight away.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token the portal verifies instead of a stored secret.
      id-token: write
    env:
      # Optional PUBLIC key that pins the internal build's extension id; never a private key.
      MEET_EXTENSION_PUBLIC_KEY: ${{ vars.MEET_EXTENSION_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The commit that was deployed, not whatever main points at by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read the build version
        id: app
        env:
          EXTENSION_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          version=$(node --input-type=module -e "const { BUILD_VERSION } = await import('./exyconn-meet-extension/scripts/lib/defines.mjs'); console.log(BUILD_VERSION);")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Quality checks
        run: |
          pnpm --filter @exyconn/meet-extension run typecheck
          pnpm --filter @exyconn/meet-extension run lint
          pnpm --filter @exyconn/meet-extension run test:coverage
      - name: Build, validate the manifest and scan the bundle
        env:
          EXTENSION_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          pnpm --filter @exyconn/meet-extension run build:production
          pnpm --filter @exyconn/meet-extension run verify
      - name: Package ZIPs and checksums
        env:
          EXTENSION_BUILD_NUMBER: ${{ github.run_number }}
          # Written into release.json, so the portal registers the build on this channel.
          RELEASE_CHANNEL: ${{ inputs.channel || 'INTERNAL' }}
        run: pnpm --filter @exyconn/meet-extension run package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meet-extension-${{ steps.app.outputs.version }}
          path: exyconn-meet-extension/artifacts/*
          if-no-files-found: error
      - name: Upload to the portal
        env:
          PORTAL_API_URL: ${{ vars.PORTAL_API_URL || 'https://portal-server.exyconn.com' }}
          RELEASE_NOTES: ${{ github.event.workflow_run.head_commit.message || github.event.head_commit.message }}
        run: node .github/scripts/upload-meet-extension.mjs
      - name: Chrome Web Store upload
        if: inputs.store_upload
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ secrets.CWS_ITEM_ID }}
          CWS_ZIP: exyconn-meet-extension/artifacts/chrome-meeting-assistant-v${{ steps.app.outputs.version }}-store.zip
          CWS_SUBMIT: ${{ inputs.store_submit && 'true' || 'false' }}
        run: |
          if [ -z "$CWS_CLIENT_ID" ] || [ -z "$CWS_ITEM_ID" ]; then
            echo "::warning::Chrome Web Store credentials are not configured; the store package is in this run's artifact for a manual upload."
            exit 0
          fi
          node .github/scripts/cws-publish.mjs
