# Security headers for the SPA containers, included by docker/spa.nginx.conf.
#
# Kept in its own file because nginx drops every inherited add_header in a block that
# declares one of its own (the static-asset location sets Cache-Control), so each block
# that adds a header has to include these again. No CSP yet: MUI/emotion inject styles
# at runtime and need a nonce strategy first. HSTS is sent by the host nginx, which owns TLS.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
