# Security headers for the SPA containers, included by docker/spa.nginx.conf.
#
# Kept in its own file because nginx drops every inherited add_header in a block that
# declares one of its own (the static-asset location sets Cache-Control), so each block
# that adds a header has to include these again. No CSP yet: MUI/emotion inject styles
# at runtime and need a nonce strategy first. HSTS is sent by the host nginx, which owns TLS.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
# Who may frame the app. `'self'` everywhere (what SAMEORIGIN says) except where the container's
# FRAME_ANCESTORS widens it — the WhatsApp demo, which exyconn.com embeds. Browsers follow
# frame-ancestors over X-Frame-Options when both are sent.
add_header Content-Security-Policy "frame-ancestors $spa_frame_ancestors" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# microphone=(self): the Website portal records voice notes in its chat console.
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
