# SPA container nginx config (inside the portal-ui image). NGINX_PORT is templated
# in at container start. This is the app container's own server — the host nginx
# in front of it terminates TLS and proxies the public domain to this port.
server {
    listen       ${NGINX_PORT};
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # No nginx version in error pages or the Server header.
    server_tokens off;
    include /etc/nginx/snippets/spa-security-headers.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/spa-security-headers.conf;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;
}
