<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/exyconn-icon.svg" />
    <link rel="apple-touch-icon" href="/exyconn-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- seo:end -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'Inter Tight', 'Segoe UI', Roboto, system-ui, sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

  <body>

    <div id="root"></div>
