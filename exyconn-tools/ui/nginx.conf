# tools.exyconn.com (port 4001). Prerendered routes live at <path>/index.html: serve that file
# for /tools/x directly. With `$uri/` nginx answered /tools/x with a 301 to its own
# http://host:4001/tools/x/ (the container port), which visitors cannot reach;
# absolute_redirect off keeps any other redirect relative. The microphone is allowed for the
# chat iframe from exyconn.com (voice notes).
server {
    listen 4001;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    add_header Permissions-Policy 'camera=(), microphone=(self "https://exyconn.com"), geolocation=()' always;

    location / {
        try_files $uri $uri/index.html /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Permissions-Policy 'camera=(), microphone=(self "https://exyconn.com"), geolocation=()' always;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;
}
