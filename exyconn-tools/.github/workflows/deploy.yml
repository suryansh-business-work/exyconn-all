# =============================================================================
# Exyconn Tools Deployment
# Services: UI (Port: 4012) | Server (Port: 4013)
# Domain: tools.exyconn.com
# =============================================================================

name: 🚀 Deploy Tools

on:
  push:
    branches: [main]
    paths: ['ui/**', 'server/**', 'docker-compose.yml', '.github/workflows/deploy.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📢 Slack - Started
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{
            "attachments": [{"color": "#0066FF", "blocks": [
              {"type": "header", "text": {"type": "plain_text", "text": "🚀 Tools - Deployment Started", "emoji": true}},
              {"type": "section", "fields": [
                {"type": "mrkdwn", "text": "*📦 Service:*\nExyconn Tools"},
                {"type": "mrkdwn", "text": "*🔌 Ports:*\n4012 (UI) | 4013 (Server)"},
                {"type": "mrkdwn", "text": "*👤 By:*\n${{ github.actor }}"},
                {"type": "mrkdwn", "text": "*🏷️ Build:*\n#${{ github.run_number }}"}
              ]}
            ]}]
          }' ${{ secrets.SLACK_WEBHOOK }}

      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏗️ Build & Push UI
        uses: docker/build-push-action@v5
        with:
          context: ./ui
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/exyconn-tools-ui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build & Push Server
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/exyconn-tools-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🚀 Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            
            # Create network if not exists
            docker network create exyconn-network 2>/dev/null || true
            
            # Kill any process using ports
            sudo fuser -k 4012/tcp 2>/dev/null || true
            sudo fuser -k 4013/tcp 2>/dev/null || true
            
            # ===== Deploy Server =====
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/exyconn-tools-server:latest
            docker stop exyconn-tools-server 2>/dev/null || true
            docker rm -f exyconn-tools-server 2>/dev/null || true
            
            docker ps -q --filter "publish=4013" | xargs -r docker stop || true
            docker ps -aq --filter "publish=4013" | xargs -r docker rm -f || true
            
            docker run -d \
              --name exyconn-tools-server \
              --restart unless-stopped \
              --network exyconn-network \
              -p 4013:4013 \
              -e NODE_ENV=production \
              -e PORT=4013 \
              ${{ secrets.DOCKERHUB_USERNAME }}/exyconn-tools-server:latest
            
            # ===== Deploy UI =====
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/exyconn-tools-ui:latest
            docker stop exyconn-tools-ui 2>/dev/null || true
            docker rm -f exyconn-tools-ui 2>/dev/null || true
            
            docker ps -q --filter "publish=4012" | xargs -r docker stop || true
            docker ps -aq --filter "publish=4012" | xargs -r docker rm -f || true
            
            docker run -d \
              --name exyconn-tools-ui \
              --restart unless-stopped \
              --network exyconn-network \
              -p 4012:4012 \
              -e NODE_ENV=production \
              -e VITE_API_URL=https://tools-api.exyconn.com \
              ${{ secrets.DOCKERHUB_USERNAME }}/exyconn-tools-ui:latest
            
            sleep 5
            echo "=== Running Containers ==="
            docker ps --filter "name=exyconn-tools"
            curl -sf http://localhost:4013/health || echo "Server starting..."
            curl -sf http://localhost:4012/ | head -3 || echo "UI starting..."

      - name: ✅ Slack - Success
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{
            "attachments": [{"color": "#00C853", "blocks": [
              {"type": "header", "text": {"type": "plain_text", "text": "✅ Tools - Deployed!", "emoji": true}},
              {"type": "section", "fields": [
                {"type": "mrkdwn", "text": "*🌐 UI:*\nhttps://tools.exyconn.com"},
                {"type": "mrkdwn", "text": "*🔌 Ports:*\n4012 | 4013"}
              ]},
              {"type": "actions", "elements": [
                {"type": "button", "text": {"type": "plain_text", "text": "🌐 Open Tools"}, "url": "https://tools.exyconn.com", "style": "primary"}
              ]}
            ]}]
          }' ${{ secrets.SLACK_WEBHOOK }}

      - name: ❌ Slack - Failed
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{
            "attachments": [{"color": "#FF1744", "blocks": [
              {"type": "header", "text": {"type": "plain_text", "text": "❌ Tools - FAILED!", "emoji": true}},
              {"type": "actions", "elements": [
                {"type": "button", "text": {"type": "plain_text", "text": "📋 Logs"}, "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "style": "danger"}
              ]}
            ]}]
          }' ${{ secrets.SLACK_WEBHOOK }}
