# exyconn.com request-body limit — included in the exyconn.com server blocks.
# Installed to /etc/nginx/snippets/ by deploy/server-setup.sh, which also syncs the include
# into the certbot-managed vhost.
#
# nginx's default is 1 MB. A job application posts its résumé (up to 5 MB) as base64 JSON
# to /api/job-application — about 6.7 MB on the wire — so the website needs more headroom.
# The portal API behind it already accepts 15 MB (portal-server.exyconn.com.conf).
client_max_body_size 8m;
