# Exyconn security headers — included in every Exyconn server block (deploy/nginx/*.conf).
# Installed to /etc/nginx/snippets/ by deploy/server-setup.sh.
#
# Each header is only added when the upstream app did not already send it (the
# $exyconn_* variables are empty otherwise — see http/00-exyconn-http-context.conf), so an
# app's own stricter value (e.g. the website's HSTS preload) is never duplicated or
# contradicted.
#
# nginx drops ALL inherited add_header directives in a block that declares its own, so a
# location that adds a header must include this file again.
server_tokens off;

add_header Strict-Transport-Security $exyconn_hsts always;
add_header X-Content-Type-Options $exyconn_nosniff always;
add_header X-Frame-Options $exyconn_frame_options always;
add_header Referrer-Policy $exyconn_referrer_policy always;
add_header Permissions-Policy $exyconn_permissions_policy always;
