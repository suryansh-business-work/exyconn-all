# Text compression for everything the website container serves. The host's nginx.conf only
# compresses text/html, so Astro's CSS and JS (126 KB stylesheet, three.js) went out raw.
# Server context, so it never clashes with another site's http{}-level gzip settings.
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css text/plain text/xml application/javascript text/javascript application/json application/xml application/manifest+json image/svg+xml;
