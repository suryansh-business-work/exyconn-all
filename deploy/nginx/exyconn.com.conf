# exyconn.com -> website container on 127.0.0.1:4000
# HTTP only; `certbot --nginx` injects the TLS (443) block + HTTP->HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name exyconn.com www.exyconn.com;

    # The TinaCMS editor moved to its own host. The bundle and its backend are still
    # served by this same container, so the move is a redirect rather than a deletion —
    # a bookmarked /admin keeps working instead of loading an editor that cannot log in
    # (only tina-cms.exyconn.com is in Astro's allowedDomains).
    location /admin {
        return 301 https://tina-cms.exyconn.com$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
