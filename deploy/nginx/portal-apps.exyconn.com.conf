# Exyconn portal micro-frontends — one vhost per module app.
#
# Each module of the portal is its own Vite build on its own subdomain, proxied to
# its container port (see docker-compose.prod.yml). They share one sign-in through
# a cookie scoped to .exyconn.com, and all call portal-server.exyconn.com.
#
# HTTP only; `certbot --nginx` injects the TLS (443) block + HTTP->HTTPS redirect.
# Kept separate from exyconn.com.conf so certbot never has to rewrite the apex
# site's vhost when a portal app is added.

# admin.exyconn.com -> 127.0.0.1:4020
server {
    listen 80;
    listen [::]:80;
    server_name admin.exyconn.com;

    client_max_body_size 15m;

    location / {
        proxy_pass http://127.0.0.1:4020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

