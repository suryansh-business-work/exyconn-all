# demos.exyconn.com — every Exyconn demo on one origin, each under its own path.
#
#   /                    -> 127.0.0.1:4040  the landing page listing the demos (demos/hub)
#   /whatsapp-demo/      -> 127.0.0.1:4038  the WhatsApp Business automation demo
#   /calling-bot-demo/   -> 127.0.0.1:4041  the AI calling bot demo
#   /calling-bot-demo/api/ -> 127.0.0.1:4042  its voice server: browser call socket, Vobiz
#                            answer/hangup webhooks and the Vobiz media stream socket
#   /website-chat-demo/  -> 127.0.0.1:4043  the AI website chat agent demo
#
# Each UI is built with its path as Vite's `base`, so the prefix is stripped here
# (`proxy_pass .../`) and every container serves its build from its own root.
#
# HTTP only; `certbot --nginx` injects the TLS (443) block + HTTP->HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name demos.exyconn.com;
    include /etc/nginx/snippets/exyconn-security-headers.conf;

    client_max_body_size 15m;

    location = /whatsapp-demo {
        return 301 /whatsapp-demo/$is_args$args;
    }

    location /whatsapp-demo/ {
        proxy_pass http://127.0.0.1:4038/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /calling-bot-demo {
        return 301 /calling-bot-demo/$is_args$args;
    }

    # Live audio: the browser's call socket and Vobiz's media stream stay open for the whole
    # call, so neither is buffered nor timed out at nginx's 60s default.
    location /calling-bot-demo/api/ {
        proxy_pass http://127.0.0.1:4042/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /calling-bot-demo/ {
        proxy_pass http://127.0.0.1:4041/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /website-chat-demo {
        return 301 /website-chat-demo/$is_args$args;
    }

    location /website-chat-demo/ {
        proxy_pass http://127.0.0.1:4043/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:4040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# whatsapp-demo.exyconn.com — retired: the demo moved to demos.exyconn.com/whatsapp-demo/.
# Old links keep working: the demo's own pages (/whatsapp-demo/<chat>) and everything else
# (/admin, /login) land on the same page under the new address. A `#visitor=` fragment
# survives the redirect, so a pass handed over by an old website link still signs in.
server {
    listen 80;
    listen [::]:80;
    server_name whatsapp-demo.exyconn.com;
    include /etc/nginx/snippets/exyconn-security-headers.conf;

    location = /whatsapp-demo {
        return 301 https://demos.exyconn.com/whatsapp-demo/$is_args$args;
    }

    location /whatsapp-demo/ {
        rewrite ^/whatsapp-demo/(.*)$ https://demos.exyconn.com/whatsapp-demo/$1 permanent;
    }

    location / {
        return 301 https://demos.exyconn.com/whatsapp-demo$request_uri;
    }
}
