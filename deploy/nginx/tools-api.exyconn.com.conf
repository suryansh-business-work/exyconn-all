# tools-api.exyconn.com -> 127.0.0.1:4002
# HTTP only; `certbot --nginx` injects the TLS (443) block + HTTP->HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name tools-api.exyconn.com;

    # APIs can receive large bodies (e.g. tracker screenshots on portal-server).
    client_max_body_size 15m;

    location / {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
