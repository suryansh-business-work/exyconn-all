# Exyconn http{}-context definitions: rate-limit zones and the header maps used by
# snippets/exyconn-security-headers.conf.
#
# limit_req_zone and map are only valid in http{}. deploy/server-setup.sh installs this
# file into sites-available/ and links it from sites-enabled/ — the directory nginx.conf
# already includes inside http{} for every vhost — rather than relying on conf.d being
# included on a host it shares with other sites. Everything is prefixed exyconn_ so it
# cannot clash with the other sites' definitions.

limit_req_zone $binary_remote_addr zone=exyconn_portal_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=exyconn_tools_api:10m rate=10r/s;

# Empty when the upstream already set the header, which makes add_header skip it.
map $upstream_http_strict_transport_security $exyconn_hsts {
    ""      "max-age=31536000; includeSubDomains";
    default "";
}

map $upstream_http_x_content_type_options $exyconn_nosniff {
    ""      "nosniff";
    default "";
}

map $upstream_http_x_frame_options $exyconn_frame_options {
    ""      "SAMEORIGIN";
    default "";
}

map $upstream_http_referrer_policy $exyconn_referrer_policy {
    ""      "strict-origin-when-cross-origin";
    default "";
}

# geolocation=(self): the tools site's lead generator asks for the visitor's location.
map $upstream_http_permissions_policy $exyconn_permissions_policy {
    ""      "camera=(), microphone=(), geolocation=(self)";
    default "";
}
