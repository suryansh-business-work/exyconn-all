# tina-cms.exyconn.com -> the website container on 127.0.0.1:4000, editor surface only.
# HTTP only; `certbot --nginx` injects the TLS (443) block + HTTP->HTTPS redirect.
#
# The editor and the public site are the SAME Astro server: /admin is a static SPA in
# public/ and its backend is /api/tina/*. So this vhost deliberately does not proxy `/`
# to 4000 — that would publish the whole marketing site a second time on this hostname
# and hand Google a duplicate of every page. Only the two editor paths are exposed, and
# everything else lands on the editor instead.
server {
    listen 80;
    listen [::]:80;
    server_name tina-cms.exyconn.com;

    # The editor posts whole markdown documents and (with static media) base64 images.
    client_max_body_size 15m;

    # An editing surface must never be indexed, whatever it happens to return.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Nothing else on this host is the CMS, so send it to the editor rather than
    # serving — or 404-ing — a marketing page under a hostname that is not its own.
    location = / {
        return 302 /admin/index.html;
    }

    location /admin {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # The GraphQL + Auth.js backend the editor talks to. Same origin as /admin by
    # design: the session cookie is host-scoped, so splitting them would sign the
    # editor out on every request.
    location /api/tina {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The editor bundle pulls its JS/CSS from /admin/assets, but Astro also serves the
    # site's own hashed assets from /_astro — the SPA shell references those too.
    location /_astro {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 302 /admin/index.html;
    }
}
