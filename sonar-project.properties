sonar.projectKey=suryansh-business-work_exyconn-all_480e30bf-d277-4e68-b940-133350daf6d6
sonar.sourceEncoding=UTF-8

# Codegen output, build artefacts and reports are not hand-written code.
sonar.exclusions=**/node_modules/**,**/dist/**,**/out/**,**/coverage/**,**/graphql/generated/**,reports/**,**/cypress/a11y/**

# Coverage: .github/scripts/sonar-lcov.mjs gathers every package's lcov report here (paths made
# repository-relative) before the scan. Without it SonarQube reports 0% coverage.
sonar.javascript.lcov.reportPaths=sonar-coverage/*.lcov

# Type-aware analysis (node_modules is installed so every tsconfig resolves) holds one TypeScript
# program per package, and the portal apps all pull in the shared packages' sources. The default
# 4 GB heap ran out within two minutes; the runner has 16 GB.
sonar.javascript.node.maxspace=10240

# What is not measured for coverage: the tests themselves and what only tests use (specs, mocks,
# fixtures, harnesses), build and tool configuration, repository scripts, and the Kotlin native
# module (compiled and exercised on a device, not by the unit suites). Source code is not listed
# here, and issues are still reported for every one of these files.
sonar.coverage.exclusions=\
  **/__tests__/**,\
  **/tests/**,\
  **/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,\
  **/*.cy.ts,**/*.cy.tsx,\
  **/cypress/**,\
  **/vite.config.*,**/vitest.config.*,**/jest.config.*,**/eslint.config.*,**/*.config.js,**/*.config.mjs,**/*.config.cjs,**/*.config.ts,\
  scripts/**,.github/**,docker/**,deploy/**,\
  exyconn-tracker-mobile/modules/**
