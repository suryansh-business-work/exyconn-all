  # The vendor portal: a supplier's people see purchase orders, send invoices and follow payment.
  portal-vendors:
    <<: *hardened
    image: ${DOCKERHUB_USERNAME}/exyconn-portal-vendors:${TAG:-latest}
    container_name: exyconn-portal-vendors
