  portal-tech:
    <<: *hardened
    image: ${DOCKERHUB_USERNAME}/exyconn-portal-tech:${TAG:-latest}
    container_name: exyconn-portal-tech
    restart: unless-stopped
    ports:
      - '127.0.0.1:4033:4033'

  portal-it:
    <<: *hardened
    image: ${DOCKERHUB_USERNAME}/exyconn-portal-it:${TAG:-latest}
    container_name: exyconn-portal-it
    restart: unless-stopped
    ports:
      - '127.0.0.1:4034:4034'

  # The ISO management system: risks, objectives, audits, findings, management review.
  portal-compliance:
    <<: *hardened
    image: ${DOCKERHUB_USERNAME}/exyconn-portal-compliance:${TAG:-latest}
    container_name: exyconn-portal-compliance
    restart: unless-stopped
