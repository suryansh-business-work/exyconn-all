  portal-hr:
    <<: *hardened
    image: ${DOCKERHUB_USERNAME}/exyconn-portal-hr:${TAG:-latest}
    container_name: exyconn-portal-hr
    restart: unless-stopped
    ports:
      - '127.0.0.1:4027:4027'

  portal-marketing:
    <<: *hardened
    image: ${DOCKERHUB_USERNAME}/exyconn-portal-marketing:${TAG:-latest}
    container_name: exyconn-portal-marketing
