  # The Agents console: WhatsApp, calling and website chat agents, their sessions and leads.
  portal-agents:
    <<: *hardened
    image: ${DOCKERHUB_USERNAME}/exyconn-portal-agents:${TAG:-latest}
    container_name: exyconn-portal-agents
    restart: unless-stopped
