  # The client hub: a client's people pay invoices, raise tickets and follow projects.
  portal-clienthub:
    <<: *hardened
    image: ${DOCKERHUB_USERNAME}/exyconn-portal-clienthub:${TAG:-latest}
    container_name: exyconn-portal-clienthub
    restart: unless-stopped
    ports:
      - '127.0.0.1:4039:4039'

  # Public status page — no sign-in: an outage is exactly when nobody can log in.
  portal-status:
    <<: *hardened
    image: ${DOCKERHUB_USERNAME}/exyconn-portal-status:${TAG:-latest}
    container_name: exyconn-portal-status
    restart: unless-stopped
    ports:
      - '127.0.0.1:4035:4035'

  portal-server:
    <<: *hardened-node
    image: ${DOCKERHUB_USERNAME}/exyconn-portal-server:${TAG:-latest}
    container_name: exyconn-portal-server
    restart: unless-stopped
    ports:
      - '127.0.0.1:4004:4004'
    environment:
      NODE_ENV: production
      PORT: 4004
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      # Every portal micro-frontend calls this API from its own origin.
      CORS_ORIGIN: https://portal.exyconn.com,https://admin.exyconn.com,https://employee.exyconn.com,https://finance.exyconn.com,https://support.exyconn.com,https://crm.exyconn.com,https://products.exyconn.com,https://legal.exyconn.com,https://hr.exyconn.com,https://marketing.exyconn.com,https://projects.exyconn.com,https://ai.exyconn.com,https://website.exyconn.com,https://tracker.exyconn.com,https://tech.exyconn.com,https://it.exyconn.com,https://compliance.exyconn.com,https://social.exyconn.com,https://demos.exyconn.com,https://clienthub.exyconn.com,https://mcp.exyconn.com,https://agents.exyconn.com,https://status.exyconn.com,https://developers.exyconn.com,https://vendors.exyconn.com
      APP_URL: https://portal.exyconn.com
      # The public sites the website chat widget opens its socket from (Agents > Website chat).
      CHAT_ORIGINS: https://exyconn.com,https://tools.exyconn.com
      WEBSITE_URL: https://exyconn.com
      # The address Website › Settings offers as a site's A record (the deploy writes it to .env).
      WEBSITE_SERVER_IP: ${WEBSITE_SERVER_IP:-}
      TRACKER_DOWNLOAD_URL: https://employee.exyconn.com/me/tracker
      # Where the payslip email sends an employee for the rest of their payslips.
      SALARY_SLIPS_URL: https://employee.exyconn.com/me/salary-slips
      # Public status page: the domain the seeded monitors hang off, and how often
      # this process probes them. The catalogue itself lives in the database.
      STATUS_DOMAIN: exyconn.com
      STATUS_CHECK_INTERVAL_MS: 300000
      # Tech > Infrastructure reads the live stack through the read-only socket proxy
      # below. Never the raw socket: /var/run/docker.sock is root on the host.
      DOCKER_API_URL: http://docker-proxy:2375
      # What the host's nightly backup last did, for Admin > System Health. Read-only,
      # and outside the database on purpose: a backup's record must survive the thing it
      # is insuring.
      BACKUP_STATUS_FILE: /var/lib/exyconn/backup/status.json
      # The meeting bot service's shared secret (the meet-bot service holds the same one).
      MEET_BOT_TOKEN: ${MEET_BOT_TOKEN:-}
    volumes:
      # Only the status directory, never the archive directory: a dump of the whole
      # company has no business being readable inside a web-facing container.
      - /opt/exyconn-backup-status:/var/lib/exyconn/backup:ro
    # Boot writes every company's defaults and repairs before the API listens (server.ts), so
    # startup grows with the number of organizations and outran the image's 20s start period
    # (deploy 37204180164). Failures inside start_period do not count, and the first passing
    # check marks the API healthy at once, so a fast boot is not slowed down.
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:4004/health']
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 3
    depends_on:
      - docker-proxy
    # default: the host-published port; docker-api: the only route to the socket proxy.
    networks:
      - default
      - docker-api

  # A GET-only window onto the Docker engine for portal-server's Infrastructure screen.
  # Everything that could change the host — POST, exec, build, swarm, the secrets and
  # configs endpoints — stays off, so a compromise of the API can read the stack but
  # never touch it. Not published to the host, and on an internal network shared with
  # portal-server alone: no other container (tools-api fetches user URLs) can reach it.
  docker-proxy:
    <<: *hardened
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: exyconn-docker-proxy
    restart: unless-stopped
    networks:
      - docker-api
    environment:
      # Only what exyconn-portal/server/src/modules/infra/docker.client.ts calls:
      # /info, /version, /containers, /images and /system/df.
      INFO: 1
      VERSION: 1
      CONTAINERS: 1
      IMAGES: 1
      SYSTEM: 1
      # Explicitly off: anything that mutates the host or leaks credentials.
      NETWORKS: 0
      VOLUMES: 0
      EVENTS: 0
      POST: 0
      EXEC: 0
      BUILD: 0
      COMMIT: 0
      AUTH: 0
      SECRETS: 0
      CONFIGS: 0
      SWARM: 0
      NODES: 0
      SERVICES: 0
      TASKS: 0
      PLUGINS: 0
      SESSION: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  default: {}
  # No gateway, no host or internet access: portal-server <-> docker-proxy only.
  docker-api:
    internal: true
