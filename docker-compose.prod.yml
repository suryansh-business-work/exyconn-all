    image: ${DOCKERHUB_USERNAME}/exyconn-portal-legal:${TAG:-latest}
    container_name: exyconn-portal-legal
    restart: unless-stopped
    ports:
      - '127.0.0.1:4026:4026'

  portal-hr:
    <<: *hardened
    image: ${DOCKERHUB_USERNAME}/exyconn-portal-hr:${TAG:-latest}
    container_name: exyconn-portal-hr
    restart: unless-stopped
