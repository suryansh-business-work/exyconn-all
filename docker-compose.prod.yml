# =============================================================================
# Exyconn production stack (host: 148.135.136.107)
#
# Runs the web services as containers on their assigned host ports. TLS and the
# public domains are handled by the HOST nginx (sites-available) + certbot in front of
# these ports — see deploy/nginx/ and deploy/server-setup.sh. This file does NOT run
# nginx/certbot itself.
#
# Images are pulled from Docker Hub (pushed by CI). Runtime secrets come from a .env file
# on the server (written by the deploy workflow from GitHub secrets) — never baked in.
# =============================================================================

services:
  website:
    image: ${DOCKERHUB_USERNAME}/exyconn-website:${TAG:-latest}
    container_name: exyconn-website
    restart: unless-stopped
    ports:
      - '127.0.0.1:4000:4000'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      PUBLIC_SITE_URL: https://exyconn.com
      PUBLIC_PORTAL_GRAPHQL_URL: https://portal-server.exyconn.com/graphql
      # No SMTP here: form notifications are sent by portal-server using the
      # SMTP account configured in Admin > Environment Variables.
      # TinaCMS editor at /admin: self-hosted backend, content index in MongoDB, saves
      # committed to GitHub on main (which redeploys the site).
      MONGODB_URI: ${MONGODB_URI}
      GITHUB_OWNER: suryansh-business-work
      GITHUB_REPO: exyconn-all
      GITHUB_BRANCH: main
      GITHUB_PERSONAL_ACCESS_TOKEN: ${TINA_GITHUB_TOKEN}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      # The Tina editor is reached at website.exyconn.com (nginx proxies /admin
      # and /api/tina here), so its auth callback has to match that host.
      NEXTAUTH_URL: https://website.exyconn.com/api/tina/auth

  tools-ui:
    image: ${DOCKERHUB_USERNAME}/exyconn-tools-ui:${TAG:-latest}
    container_name: exyconn-tools-ui
    restart: unless-stopped
    ports:
      - '127.0.0.1:4001:4001'

  tools-api:
    image: ${DOCKERHUB_USERNAME}/exyconn-tools-api:${TAG:-latest}
    container_name: exyconn-tools-api
    restart: unless-stopped
    ports:
      - '127.0.0.1:4002:4002'
    environment:
      NODE_ENV: production
      PORT: 4002
      # SMTP and ImageKit credentials are read from the database, where the
      # portal manages them under Admin > Environment Variables.
      MONGODB_URI: ${MONGODB_URI}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_MAP_API: ${GOOGLE_MAP_API}

  # Portal micro-frontends: the hub plus one app per module, each on its own
  # subdomain. They share the login cookie scoped to .exyconn.com and all talk
  # to the single portal-server below.
  portal-hub:
    image: ${DOCKERHUB_USERNAME}/exyconn-portal-hub:${TAG:-latest}
    container_name: exyconn-portal-hub
    restart: unless-stopped
    ports:
      - '127.0.0.1:4003:4003'

  portal-admin:
    image: ${DOCKERHUB_USERNAME}/exyconn-portal-admin:${TAG:-latest}
    container_name: exyconn-portal-admin
    restart: unless-stopped
    ports:
      - '127.0.0.1:4020:4020'

  portal-employee:
    image: ${DOCKERHUB_USERNAME}/exyconn-portal-employee:${TAG:-latest}
    container_name: exyconn-portal-employee
    restart: unless-stopped
    ports:
      - '127.0.0.1:4021:4021'

  portal-finance:
    image: ${DOCKERHUB_USERNAME}/exyconn-portal-finance:${TAG:-latest}
    container_name: exyconn-portal-finance
    restart: unless-stopped
    ports:
      - '127.0.0.1:4022:4022'

  portal-support:
    image: ${DOCKERHUB_USERNAME}/exyconn-portal-support:${TAG:-latest}
    container_name: exyconn-portal-support
    restart: unless-stopped
    ports:
      - '127.0.0.1:4023:4023'

  portal-crm:
    image: ${DOCKERHUB_USERNAME}/exyconn-portal-crm:${TAG:-latest}
    container_name: exyconn-portal-crm
    restart: unless-stopped
    ports:
      - '127.0.0.1:4024:4024'

  portal-products:
    image: ${DOCKERHUB_USERNAME}/exyconn-portal-products:${TAG:-latest}
    container_name: exyconn-portal-products
    restart: unless-stopped
    ports:
      - '127.0.0.1:4025:4025'

  portal-legal:
    image: ${DOCKERHUB_USERNAME}/exyconn-portal-legal:${TAG:-latest}
    container_name: exyconn-portal-legal
    restart: unless-stopped
    ports:
      - '127.0.0.1:4026:4026'

  portal-hr:
    image: ${DOCKERHUB_USERNAME}/exyconn-portal-hr:${TAG:-latest}
    container_name: exyconn-portal-hr
    restart: unless-stopped
    ports:
      - '127.0.0.1:4027:4027'

  portal-marketing:
    image: ${DOCKERHUB_USERNAME}/exyconn-portal-marketing:${TAG:-latest}
    container_name: exyconn-portal-marketing
    restart: unless-stopped
    ports:
      - '127.0.0.1:4028:4028'

  portal-projects:
    image: ${DOCKERHUB_USERNAME}/exyconn-portal-projects:${TAG:-latest}
    container_name: exyconn-portal-projects
    restart: unless-stopped
    ports:
      - '127.0.0.1:4029:4029'

  portal-ai:
    image: ${DOCKERHUB_USERNAME}/exyconn-portal-ai:${TAG:-latest}
    container_name: exyconn-portal-ai
    restart: unless-stopped
    ports:
      - '127.0.0.1:4030:4030'

  portal-website:
    image: ${DOCKERHUB_USERNAME}/exyconn-portal-website:${TAG:-latest}
    container_name: exyconn-portal-website
    restart: unless-stopped
    ports:
      - '127.0.0.1:4031:4031'

  portal-tracker:
    image: ${DOCKERHUB_USERNAME}/exyconn-portal-tracker:${TAG:-latest}
    container_name: exyconn-portal-tracker
    restart: unless-stopped
    ports:
      - '127.0.0.1:4032:4032'

  portal-tech:
    image: ${DOCKERHUB_USERNAME}/exyconn-portal-tech:${TAG:-latest}
    container_name: exyconn-portal-tech
    restart: unless-stopped
    ports:
      - '127.0.0.1:4033:4033'

  portal-it:
    image: ${DOCKERHUB_USERNAME}/exyconn-portal-it:${TAG:-latest}
    container_name: exyconn-portal-it
    restart: unless-stopped
    ports:
      - '127.0.0.1:4034:4034'

  # Public status page — no sign-in: an outage is exactly when nobody can log in.
  portal-status:
    image: ${DOCKERHUB_USERNAME}/exyconn-portal-status:${TAG:-latest}
    container_name: exyconn-portal-status
    restart: unless-stopped
    ports:
      - '127.0.0.1:4035:4035'

  portal-server:
    image: ${DOCKERHUB_USERNAME}/exyconn-portal-server:${TAG:-latest}
    container_name: exyconn-portal-server
    restart: unless-stopped
    ports:
      - '127.0.0.1:4004:4004'
    environment:
      NODE_ENV: production
      PORT: 4004
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      # Every portal micro-frontend calls this API from its own origin.
      CORS_ORIGIN: https://portal.exyconn.com,https://admin.exyconn.com,https://employee.exyconn.com,https://finance.exyconn.com,https://support.exyconn.com,https://crm.exyconn.com,https://products.exyconn.com,https://legal.exyconn.com,https://hr.exyconn.com,https://marketing.exyconn.com,https://projects.exyconn.com,https://ai.exyconn.com,https://website.exyconn.com,https://tracker.exyconn.com,https://tech.exyconn.com,https://it.exyconn.com,https://status.exyconn.com
      APP_URL: https://portal.exyconn.com
      TRACKER_DOWNLOAD_URL: https://employee.exyconn.com/me/tracker
      # Where the payslip email sends an employee for the rest of their payslips.
      SALARY_SLIPS_URL: https://employee.exyconn.com/me/salary-slips
      # Public status page: the domain the seeded monitors hang off, and how often
      # this process probes them. The catalogue itself lives in the database.
      STATUS_DOMAIN: exyconn.com
      STATUS_CHECK_INTERVAL_MS: 300000
      # Tech > Infrastructure reads the live stack through the read-only socket proxy
      # below. Never the raw socket: /var/run/docker.sock is root on the host.
      DOCKER_API_URL: http://docker-proxy:2375
    depends_on:
      - docker-proxy

  # A GET-only window onto the Docker engine for portal-server's Infrastructure screen.
  # Everything that could change the host — POST, exec, build, swarm, the secrets and
  # configs endpoints — stays off, so a compromise of the API can read the stack but
  # never touch it. Not published to the host: only the compose network can reach it.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: exyconn-docker-proxy
    restart: unless-stopped
    environment:
      INFO: 1
      VERSION: 1
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      SYSTEM: 1
      # Explicitly off: anything that mutates the host or leaks credentials.
      POST: 0
      EXEC: 0
      BUILD: 0
      COMMIT: 0
      AUTH: 0
      SECRETS: 0
      CONFIGS: 0
      SWARM: 0
      NODES: 0
      SERVICES: 0
      TASKS: 0
      PLUGINS: 0
      SESSION: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
