  portal-social:
    <<: *hardened
    image: ${DOCKERHUB_USERNAME}/exyconn-portal-social:${TAG:-latest}
    container_name: exyconn-portal-social
    restart: unless-stopped
    ports:
      - '127.0.0.1:4036:4036'

  # The WhatsApp Business automation demo sales walks clients through.
  portal-whatsapp-demo:
    <<: *hardened
    image: ${DOCKERHUB_USERNAME}/exyconn-portal-whatsapp-demo:${TAG:-latest}
    container_name: exyconn-portal-whatsapp-demo
    restart: unless-stopped
    ports:
      - '127.0.0.1:4038:4038'
    environment:
      # The WhatsApp chatbot page on exyconn.com runs the live demo in a frame.
      FRAME_ANCESTORS: "'self' https://exyconn.com https://www.exyconn.com"

  # demos.exyconn.com: the public page listing every demo (deploy/nginx/demos.exyconn.com.conf).
  demos-hub:
    <<: *hardened
    image: ${DOCKERHUB_USERNAME}/exyconn-demos-hub:${TAG:-latest}
    container_name: exyconn-demos-hub
    restart: unless-stopped
    ports:
      - '127.0.0.1:4040:4040'

  # demos.exyconn.com/calling-bot-demo/: the AI calling bot's call screen.
  calling-bot-demo:
    <<: *hardened
    image: ${DOCKERHUB_USERNAME}/exyconn-calling-bot-demo:${TAG:-latest}
    container_name: exyconn-calling-bot-demo
    restart: unless-stopped
    ports:
      - '127.0.0.1:4041:4041'

  # demos.exyconn.com/website-chat-demo/: the AI website chat agent on sample websites.
  website-chat-demo:
    <<: *hardened
    image: ${DOCKERHUB_USERNAME}/exyconn-website-chat-demo:${TAG:-latest}
    container_name: exyconn-website-chat-demo
    restart: unless-stopped
    ports:
      - '127.0.0.1:4043:4043'

  # demos.exyconn.com/meeting-bot-demo/: the AI meeting bot joins a visitor's Google Meet call.
  meeting-bot-demo:
    <<: *hardened
    image: ${DOCKERHUB_USERNAME}/exyconn-meeting-bot-demo:${TAG:-latest}
    container_name: exyconn-meeting-bot-demo
    restart: unless-stopped
    ports:
      - '127.0.0.1:4048:4048'

  # demos.exyconn.com/mcp-sandbox-demo/: a read-only MCP token on the sandbox company.
  mcp-sandbox-demo:
    <<: *hardened
    image: ${DOCKERHUB_USERNAME}/exyconn-mcp-sandbox-demo:${TAG:-latest}
    container_name: exyconn-mcp-sandbox-demo
    restart: unless-stopped
    ports:
      - '127.0.0.1:4049:4049'

  # The calling bot's voice server (demos.exyconn.com/calling-bot-demo/api/): live audio from a
  # browser or a Vobiz phone call through Sarvam AI and OpenAI. Its credentials live in the
  # active calling bot config in the database (Agents > Calling bot), none here.
  calling-bot-voice:
    <<: *hardened-node
    image: ${DOCKERHUB_USERNAME}/exyconn-calling-bot-voice:${TAG:-latest}
    container_name: exyconn-calling-bot-voice
    restart: unless-stopped
    ports:
      - '127.0.0.1:4042:4042'
    environment:
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI}
      PUBLIC_URL: https://demos.exyconn.com/calling-bot-demo/api

  # The Meeting Assistant's meeting bot: joins Google Meet calls in Chromium on a virtual
  # display and records them for their owner. No published port: it only calls portal-server
  # over the compose network. The bot's Google sign-in is the Chrome profile in the volume
  # (docs/portal/meeting-assistant/bot.md); without one it joins as a guest the host admits.
  meet-bot:
    <<: *hardened-node
    image: ${DOCKERHUB_USERNAME}/exyconn-meet-bot:${TAG:-latest}
    container_name: exyconn-meet-bot
    restart: unless-stopped
    # Chromium needs a larger /dev/shm than Docker's 64 MB; ~1 CPU and 1 GB per call.
    shm_size: 1gb
    mem_limit: 3g
    environment:
      NODE_ENV: production
      PORTAL_API_URL: http://portal-server:4004
      MEET_BOT_TOKEN: ${MEET_BOT_TOKEN:-}
      MEET_BOT_CONCURRENCY: 2
    volumes:
      - /opt/exyconn-meet-bot/profile:/data/profile
    depends_on:
      - portal-server

  # Reacher (github.com/reacherhq/check-if-email-exists): checks that an email address exists
  # without sending anything, for CRM > Tools > Email verifier. No published port: only the
  # portal server calls it, over the compose network (REACHER_URL, default http://reacher:8080).
  # Mailbox checks speak SMTP on port 25, which this host blocks outbound; a SOCKS5 proxy set in
  # Tech > Environment Variables > Email verifier is passed with each request.
  reacher:
    <<: *hardened
    image: reacherhq/backend:v0.11.7
    container_name: exyconn-reacher
    restart: unless-stopped
    mem_limit: 768m
    environment:
      RCH__HELLO_NAME: exyconn.com
      RCH__FROM_EMAIL: verify@exyconn.com

  # The MCP portal: Claude's connectors (one server per module and a global one) and their
  # tools, usage, activity and connections. The MCP endpoints themselves live on portal-server.
  portal-mcp:
    <<: *hardened
    image: ${DOCKERHUB_USERNAME}/exyconn-portal-mcp:${TAG:-latest}
    container_name: exyconn-portal-mcp
    restart: unless-stopped
