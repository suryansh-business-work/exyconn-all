<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Exyconn — AI Automation & SaaS Solutions">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Decorative grid -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200"/>
    <path d="M100 0V630M300 0V630M500 0V630M700 0V630M900 0V630M1100 0V630"/>
  </g>

  <!-- Brand mark -->
  <g transform="translate(80,80)">
    <circle cx="28" cy="28" r="26" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <text x="28" y="38" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">E</text>
    <text x="76" y="38" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">Exyconn</text>
  </g>

  <!-- Headline -->
  <g transform="translate(80,250)">
    <text font-family="Inter, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="#ffffff">
      <tspan x="0" dy="0">Focus on Value Creation.</tspan>
      <tspan x="0" dy="86" fill="url(#accent)">We Handle the Shell.</tspan>
    </text>
    <text x="0" y="260" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#cbd5e1">
      AI Automation • SaaS Products • Complete Tech Infrastructure
    </text>
  </g>

  <!-- Footer URL -->
  <g transform="translate(80,560)">
    <rect x="-4" y="-32" width="200" height="44" rx="22" fill="url(#accent)"/>
    <text x="96" y="-2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0b1220" text-anchor="middle">exyconn.com</text>
  </g>
</svg>
