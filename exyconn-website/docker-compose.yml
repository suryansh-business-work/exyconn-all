version: "3.8"

services:
  exyconn-website:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exyconn-website
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - HOST=0.0.0.0
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_TO=${SMTP_TO}
      - PUBLIC_SITE_URL=${PUBLIC_SITE_URL}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
