# =============================================================================
# Exyconn Website Deployment
# Service: website | Port: 4000 | Domain: exyconn.com
# =============================================================================

name: 🌐 Deploy Website

on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'Dockerfile', 'astro.config.mjs', 'package.json', '.github/workflows/deploy-website.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📢 Slack - Started
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{
            "attachments": [{"color": "#0066FF", "blocks": [
              {"type": "header", "text": {"type": "plain_text", "text": "🚀 Website - Deployment Started", "emoji": true}},
              {"type": "section", "fields": [
                {"type": "mrkdwn", "text": "*📦 Service:*\nWebsite"},
                {"type": "mrkdwn", "text": "*🔌 Port:*\n4000"},
                {"type": "mrkdwn", "text": "*👤 By:*\n${{ github.actor }}"},
                {"type": "mrkdwn", "text": "*🏷️ Build:*\n#${{ github.run_number }}"}
              ]}
            ]}]
          }' ${{ secrets.SLACK_WEBHOOK }}

      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏗️ Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/exyconn-website:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🚀 Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            
            # Create network if not exists
            docker network create exyconn-network 2>/dev/null || true
            
            # Kill any process using port 4000
            sudo fuser -k 4000/tcp 2>/dev/null || true
            
            # Pull and deploy
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/exyconn-website:latest
            docker stop exyconn-website 2>/dev/null || true
            docker rm -f exyconn-website 2>/dev/null || true
            
            # Stop any other container using port 4000
            docker ps -q --filter "publish=4000" | xargs -r docker stop || true
            docker ps -aq --filter "publish=4000" | xargs -r docker rm -f || true
            
            docker run -d \
              --name exyconn-website \
              --restart unless-stopped \
              --network exyconn-network \
              -p 4000:4000 \
              -e "NODE_ENV=production" \
              -e "PORT=4000" \
              -e "SMTP_HOST=${{ secrets.SMTP_HOST }}" \
              -e "SMTP_PORT=${{ secrets.SMTP_PORT }}" \
              -e "SMTP_USER=${{ secrets.SMTP_USER }}" \
              -e "SMTP_PASS=${{ secrets.SMTP_PASS }}" \
              -e "SMTP_FROM=${{ secrets.SMTP_FROM }}" \
              -e "SMTP_TO=${{ secrets.SMTP_TO }}" \
              ${{ secrets.DOCKERHUB_USERNAME }}/exyconn-website:latest
            
            sleep 5
            docker ps --filter "name=exyconn-website"
            curl -sf http://localhost:4000/ | head -3 || echo "Service starting..."

      - name: ✅ Slack - Success
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{
            "attachments": [{"color": "#00C853", "blocks": [
              {"type": "header", "text": {"type": "plain_text", "text": "✅ Website - Deployed!", "emoji": true}},
              {"type": "section", "fields": [
                {"type": "mrkdwn", "text": "*🌐 URL:*\nhttps://exyconn.com"},
                {"type": "mrkdwn", "text": "*🔌 Port:*\n4000"}
              ]},
              {"type": "actions", "elements": [
                {"type": "button", "text": {"type": "plain_text", "text": "🌐 Open"}, "url": "https://exyconn.com", "style": "primary"}
              ]}
            ]}]
          }' ${{ secrets.SLACK_WEBHOOK }}

      - name: ❌ Slack - Failed
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{
            "attachments": [{"color": "#FF1744", "blocks": [
              {"type": "header", "text": {"type": "plain_text", "text": "❌ Website - FAILED!", "emoji": true}},
              {"type": "actions", "elements": [
                {"type": "button", "text": {"type": "plain_text", "text": "📋 Logs"}, "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "style": "danger"}
              ]}
            ]}]
          }' ${{ secrets.SLACK_WEBHOOK }}
